apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: k8s-portfolio-iac
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/denoso1993/k8s-portfolio-iac.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
    syncOptions:
    - CreateNamespace=true
