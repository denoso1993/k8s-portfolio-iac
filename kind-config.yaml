kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
- role: control-plane
  kubeadmConfigPatches:
  - |
    kind: ClusterConfiguration
    apiServer:
      extraArgs:
        enable-aggregator-routing: "true"
        requestheader-client-ca-file: "/etc/kubernetes/pki/front-proxy-ca.crt"
  extraPortMappings:
  - containerPort: 30000
    hostPort: 8081
    protocol: TCP
  - containerPort: 30001
    hostPort: 3000
    protocol: TCP
