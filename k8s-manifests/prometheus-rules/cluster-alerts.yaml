apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cluster-alerts
  namespace: monitoring
  labels:
    app: prometheus-operator
    release: prometheus
spec:
  groups:
  - name: cluster-health
    rules:
    - alert: PodCrashLooping
      expr: increase(kube_pod_container_status_restarts_total[5m]) > 3
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: "Pod {{ .pod }} is crash looping"
    - alert: NodeHighMemoryUsage
      expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 > 80
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "Node memory usage > 80%"
    - alert: HPA_MaxReplicasReached
      expr: kube_horizontalpodautoscaler_spec_max_replicas > 0 and kube_horizontalpodautoscaler_status_current_replicas == kube_horizontalpodautoscaler_spec_max_replicas
      for: 15m
      labels:
        severity: warning
      annotations:
        summary: "HPA {{ .horizontalpodautoscaler }} reached max replicas"
    - alert: DiskSpaceLow
      expr: node_filesystem_free_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"} * 100 < 10
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: "Disk space < 10% on {{ .node }}"
