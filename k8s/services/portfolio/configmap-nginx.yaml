    <div style="background:#000080;color:#ffff00;padding:8px 10px;border:2px solid;border-color:#fff #808080 #808080 #fff;font-size:16px;font-weight:700;text-align:center;margin-top:4px;">Confira mais detalhes do Cluster nos outros icones!</div>
    <div style="font-size:12px;color:#444;margin-top:5px;text-align:center;line-height:1.6;">
    <span style="font-size:15px;font-weight:700;color:#000080;">Links do Portfolio:</span> <span style="color:#555;">Gerenciador de Dispositivos (Dash Interativo do Cluster) | Command Prompt (API Status Kubernetes) | Paint Brush (Dashboard Grafana do Cluster)</span>
    </div></div></div>
    <div class="sb"><span><span class="dg"></span> Online - Kind - Cloudflare - WSL2</span><span>Live</span></div></div>
