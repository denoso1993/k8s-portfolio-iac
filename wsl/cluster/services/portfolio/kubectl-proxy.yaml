apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubectl-proxy
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kubectl-proxy
  template:
    metadata:
      labels:
        app: kubectl-proxy
    spec:
      containers:
      - name: kubectl-proxy
        image: bitnami/kubectl:latest
        command: ["kubectl", "proxy", "--port=8001", "--address=0.0.0.0"]
        ports:
        - containerPort: 8001
---
apiVersion: v1
kind: Service
metadata:
  name: kubectl-proxy
  namespace: default
spec:
  selector:
    app: kubectl-proxy
  ports:
  - port: 8001
    targetPort: 8001
