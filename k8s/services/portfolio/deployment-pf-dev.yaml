apiVersion: apps/v1
kind: Deployment
metadata:
  name: pf-dev
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pf-dev
  template:
    metadata:
      labels:
        app: pf-dev
    spec:
      containers:
      - command:
        - kubectl
        - port-forward
        - --address
        - 0.0.0.0
        - svc/dev-server-service
        - 5500:5500
        - -n
        - default
        - --pod-running-timeout
        - 10s
        image: bitnami/kubectl:latest
        name: kubectl
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        seccompProfile:
          type: RuntimeDefault
