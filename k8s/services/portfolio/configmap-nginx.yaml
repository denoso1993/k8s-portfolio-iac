        <div style="font-size:12px;line-height:1.5;">
          <p style="margin-bottom:4px;"><strong>Sobre mim</strong></p>
          <p style="margin-bottom:4px;">Profissional de Infraestrutura Cloud com forte especialização em ambientes <strong>Linux</strong>, <strong>Bancos de Dados</strong> e ecossistemas <strong>Cloud Native</strong>. Atualmente disponível para novos desafios, com experiência em <strong>Cloud Infrastructure</strong>, <strong>SRE</strong> e engenharia de plataforma.</p>
          <p style="margin-bottom:4px;">Minha abordagem é prática e analítica, focada em entregar soluções escaláveis e automatizadas. Este portfólio é a <strong>prova de conceito</strong> — uma aplicação hospedada em cluster Kubernetes 100% declarativo, mantido via <strong>IaC</strong> com <strong>Terraform</strong> e <strong>Helm</strong>, com observabilidade completa via <strong>Prometheus + Grafana + Loki</strong> e GitOps com <strong>ArgoCD</strong>. <strong>Tudo rodando no WSL2.</strong></p>
          <p style="margin-bottom:0;"><strong>Principais competências:</strong> Kubernetes, Docker, Terraform, Helm, ArgoCD, GitOps, Prometheus, Grafana, Linux (RHEL/Oracle), Windows Server, PostgreSQL, SQL Server, PowerShell, Cloudflare, NetworkPolicies, Disaster Recovery, RTO/RPO/MTTR.</p>
