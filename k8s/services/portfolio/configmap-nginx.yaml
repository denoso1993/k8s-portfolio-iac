    <div class="w o" id="x" style="width:750px;height:360px;top:30px;left:100px;z-index:11;">
    <div class="wt"><span>  Sobre - Denis Oliveira Ramos</span><div class="btns"><span onclick="xx('x')">X</span></div></div>
    <div class="wb" style="padding:10px 14px;font-size:12px;">
    <div style="display:flex;gap:12px;">
      <img src="https://i.imgur.com/lJoDtkK.jpeg" class="pp">
      <div style="flex:1;"><div style="font-size:16px;font-weight:700;">Denis Oliveira Ramos</div>
        <div style="font-size:12px;color:#444;">Senior Cloud and Infrastructure Engineer</div>
        <div style="font-size:11px;color:#666;margin-top:2px;">Barueri, SP | Ingles C1/C2 | 8+ anos de experiencia</div></div>
      <div style="display:flex;align-items:center;"><div class="pr">Interaja com os icones<br>para abrir as janelas</div></div>
    </div>
    <div style="font-size:12px;line-height:1.5;margin-top:6px;">
    <p style="margin-bottom:3px;"><strong>Sobre mim</strong></p>
    <p style="margin-bottom:3px;">Profissional de Infraestrutura Cloud com forte especializacao em ambientes <strong>Linux</strong>, <strong>Bancos de Dados</strong> e ecossistemas <strong>Cloud Native</strong>. Experiencia em <strong>Cloud Infrastructure</strong>, <strong>SRE</strong> e engenharia de plataforma.</p>
    <p style="margin-bottom:3px;">Este portfolio e a <strong>prova de conceito</strong>: aplicacao hospedada em cluster Kubernetes 100% declarativo, mantido via <strong>IaC</strong> com <strong>Terraform</strong> e <strong>Helm</strong>, observabilidade via <strong>Prometheus + Grafana</strong> e GitOps com <strong>ArgoCD</strong>. Tudo rodando no WSL2.</p>
    <p style="margin-bottom:0;"><strong>Competencias:</strong> Kubernetes, Docker, Terraform, Helm, ArgoCD, Prometheus, Grafana, Linux (RHEL/Oracle), Windows Server, PostgreSQL, SQL Server, PowerShell, Cloudflare, Disaster Recovery, RTO/RPO/MTTR.</p>
    </div></div>
    <div class="sb"><span><span class="dg"></span> Online - Kind - Cloudflare - WSL2</span><span>Live</span></div></div>
    <div class="w" id="t" style="width:500px;height:450px;top:60px;left:80px;z-index:5;">
    <div class="wt"><span>  Command Prompt - kubectl</span><div class="btns"><span onclick="xx('t')">X</span></div></div>
    <div class="term"><span class="p">C:\&gt; </span><span class="c">kubectl get pods -A</span>
    <span id="po" class="o">Carregando...</span><span class="o"></span>
    <span class="p">C:\&gt; </span><span class="c">kubectl get nodes</span>
    <span id="no" class="o">Carregando...</span><span class="o"></span>
    <span class="p">C:\&gt; <span class="blink">_</span></span></div></div>
    <div class="w" id="c" style="width:320px;height:150px;top:100px;left:630px;z-index:5;">
    <div class="wt"><span>  Painel de Controle</span><div class="btns"><span onclick="xx('c')">X</span></div></div>
    <div class="wb"><div class="tg">
    <span>Kubernetes</span><span>Docker</span><span>Kind</span><span>Helm</span><span>nginx</span><span>PostgreSQL</span><span>ArgoCD</span><span>Prometheus</span><span>Grafana</span><span>Loki</span><span>cert-manager</span><span>Cloudflare</span>
    </div></div></div>
    <div class="w" id="d" style="width:340px;height:230px;top:330px;left:80px;z-index:4;">
    <div class="wt"><span>  Gerenciador de Dispositivos</span><div class="btns"><span onclick="xx('d')">X</span></div></div>
    <div class="wb" style="padding:6px 10px;font-size:11px">
    <div style="font-weight:700;font-size:13px;color:#000080;">lab-sre-denoso - Kind v1.27.3</div>
    <div style="display:flex;gap:4px;flex-wrap:wrap;">
    <span class="mb"><span class="n" id="dp">15</span><span class="l">Pods</span></span>
    <span class="mb"><span class="n" id="ds">-</span><span class="l">Svcs</span></span>
    <span class="mb"><span class="n" id="dno">1</span><span class="l">No</span></span></div>
    <div style="border-top:1px solid #808080;border-bottom:1px solid #fff;padding-top:3px;margin-bottom:3px;"></div>
    <div style="font-size:11px;line-height:1.5;">
    <div>&gt; <strong>Cluster:</strong> Kind (WSL2) - K8s v1.27.3</div>
    <div>&gt; <strong>Ingress:</strong> nginx-controller</div>
    <div>&gt; <strong>Cert:</strong> cert-manager - Let's Encrypt</div>
    <div>&gt; <strong>DB:</strong> PostgreSQL 15 - StatefulSet + PVC</div>
    <div>&gt; <strong>Monitor:</strong> Prometheus + Grafana + Loki</div>
    <div>&gt; <strong>Policy:</strong> Kyverno - NetworkPolicies - HPA</div>
    <div>&gt; <strong>Tunnel:</strong> Cloudflare - TLS edge</div>
    </div></div></div>
    <div class="w" id="l" style="width:260px;height:280px;top:300px;left:630px;z-index:4;">
    <div class="wt"><span>  Links</span><div class="btns"><span onclick="xx('l')">X</span></div></div>
    <div class="wb" style="padding:6px 10px">
    <div style="font-weight:700;margin-bottom:2px;">Curriculos</div>
    <a href="https://drive.google.com/drive/folders/1HsHI4QwXOS5NkfCRBcZzUDqrOpnHI1OV" target="_blank" class="btn">Curriculo PT-BR / EN-US</a>
    <div style="font-weight:700;margin:4px 0 2px;">Links</div>
    <a href="https://linkedin.com/in/denis93" target="_blank" class="btn">LinkedIn</a>
    <a href="https://github.com/denoso1993/k8s-portfolio-iac" target="_blank" class="btn">Cluster K8s Github</a>
    <a href="mailto:denis@denisdeoliveira.com.br" class="btn">Email</a>
    <a href="https://drive.google.com/drive/folders/1FcYD8bK9-_ELUoMHFNZzyWU-5mOJTy3H" target="_blank" class="btn">Projetos + Scripts</a>
    <a href="https://drive.google.com/drive/folders/1k_4mO-j4WEoaIGngR9cGLX1WpVSKC-AD" target="_blank" class="btn">Certificados</a>
