kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
- role: control-plane
  kubeadmConfigPatches:
  - |
    kind: InitConfiguration
    nodeRegistration:
      kubeletExtraArgs:
        authorization-mode: "AlwaysAllow"
  extraPortMappings:
  - containerPort: 30000
    hostPort: 8081
    protocol: TCP
  - containerPort: 30001
    hostPort: 3000
    protocol: TCP