apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubectl-proxy
  namespace: default
  labels:
    app: kubectl-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kubectl-proxy
  template:
    metadata:
      labels:
        app: kubectl-proxy
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
      containers:
      - name: kubectl-proxy
        image: bitnami/kubectl:1.27.3
        imagePullPolicy: IfNotPresent
        command:
        - kubectl
        - proxy
        - --port=8001
        - --address=0.0.0.0
        - --accept-hosts=localhost|127.0.0.1|kubectl-proxy.default.svc.cluster.local
        - --accept-paths=^/api/v1/(pods|nodes|services|namespaces)(/|$)
        ports:
        - containerPort: 8001
          name: http
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi
        livenessProbe:
          httpGet:
            path: /api/v1/nodes
            port: 8001
          initialDelaySeconds: 10
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/v1/nodes
            port: 8001
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: kubectl-proxy
  namespace: default
spec:
  selector:
    app: kubectl-proxy
  ports:
  - port: 8001
    targetPort: 8001
    name: http
