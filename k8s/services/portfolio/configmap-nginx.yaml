apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-html-config
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Denis Oliveira Ramos | SRE & Cloud Infrastructure</title>
        <style>
            :root {
                --primary: #0078d4;
                --secondary: #24292f;
                --bg: #f0f2f5;
                --surface: rgba(255,255,255,0.93);
                --text: #1a1a1a;
                --text-light: #57606a;
                --border: #e1e4e8;
                --success: #2da44e;
                --shadow: 0 8px 30px rgba(0,0,0,0.06);
            }
            * { margin:0; padding:0; box-sizing:border-box; }
            body {
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
                background: linear-gradient(160deg, #e8f0fe 0%, #dde3ed 40%, #f0f2f5 100%);
                color: var(--text);
                min-height: 100vh; padding: 30px 20px;
                display: flex; flex-direction: column; align-items: center;
            }
            .container {
                max-width: 600px; width: 100%;
            }
            /* Header */
            .header { margin-bottom: 32px; }
            .header h1 {
                font-size: 32px; font-weight: 700; color: var(--secondary);
                letter-spacing: -0.75px; margin: 0 0 2px 0; line-height: 1.2;
            }
            .header .subtitle {
                font-size: 15px; color: var(--primary); font-weight: 500;
                margin: 0 0 4px 0;
            }
            .header .meta {
                font-size: 13px; color: var(--text-light);
                display: flex; flex-wrap: wrap; gap: 12px;
            }
            .header .meta span { display: inline-flex; align-items: center; gap: 4px; }

            /* Cards */
            .card {
                background: var(--surface);
                border-radius: 16px; padding: 28px;
                border: 1px solid var(--border);
                box-shadow: var(--shadow);
                margin-bottom: 20px;
                backdrop-filter: blur(6px);
                transition: box-shadow 0.2s;
            }
            .card:hover { box-shadow: 0 8px 30px rgba(0,0,0,0.08); }

            .section-label {
                font-size: 10px; font-weight: 700; color: var(--text-light);
                text-transform: uppercase; letter-spacing: 0.8px;
                margin-bottom: 14px;
            }

            /* Bio */
            .bio {
                font-size: 14px; line-height: 1.7; color: var(--text);
                margin: 0;
            }
            .bio + .bio { margin-top: 14px; }
            .highlight { color: var(--primary); font-weight: 600; }

            /* Tags */
            .tags { display: flex; flex-wrap: wrap; gap: 6px; }
            .tag {
                display: inline-block; padding: 4px 10px; border-radius: 6px;
                font-size: 11px; font-weight: 500; background: #f0f2f5;
                color: var(--secondary); border: 1px solid var(--border);
            }
            .tag:hover { background: #e8ecf0; }

            /* Buttons */
            .btn-group { display: flex; flex-wrap: wrap; gap: 8px; }
            .btn {
                text-decoration: none; padding: 10px 18px; border-radius: 8px;
                font-weight: 500; font-size: 13px; transition: all 0.15s;
                display: inline-flex; align-items: center; gap: 6px;
                border: 1px solid var(--border); color: var(--secondary);
                background: white; cursor: pointer; flex: 1 0 auto;
                justify-content: center;
            }
            .btn:hover { background: #f6f8fa; border-color: #8c959f; }
            .btn-primary { background: var(--primary); color: #fff; border: none; }
            .btn-primary:hover { background: #005a9e; color: #fff; }

            /* Status grid */
            .status-grid {
                display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
            }
            .status-item {
                display: flex; align-items: center; gap: 6px;
                font-size: 12px; color: var(--text-light);
            }
            .dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }
            .dot.green { background: var(--success); }

            /* Dashboard placeholder */
            .dash-placeholder {
                background: #f6f8fa; border-radius: 10px;
                border: 1px dashed var(--border);
                padding: 24px; text-align: center;
                font-size: 13px; color: var(--text-light);
            }

            /* Divider */
            hr { border: none; border-top: 1px solid var(--border); margin: 24px 0; }

            @media (max-width: 480px) {
                body { padding: 16px 12px; }
                .card { padding: 20px; }
                .header h1 { font-size: 26px; }
                .btn { font-size: 12px; padding: 8px 14px; }
                .status-grid { grid-template-columns: 1fr; }
            }
        </style>
    </head>
    <body>
        <div class="container">

            <div class="header">
                <h1>Denis Oliveira Ramos</h1>
                <div class="subtitle">Senior Cloud &amp; Infrastructure Engineer</div>
                <div class="meta">
                    <span>📍 Barueri, SP · Brasil</span>
                    <span>🌐 Inglês C1/C2</span>
                    <span>💼 Avanade (Microsoft Unified Support)</span>
                </div>
            </div>

            <!-- Bio -->
            <div class="card">
                <div class="section-label">Sobre</div>
                <div class="bio">
                    Profissional de Infraestrutura Cloud e SRE com foco em <span class="highlight">Resiliência, Disaster Recovery</span> e operações de <span class="highlight">alta disponibilidade</span>. Na Avanade, atuo mitigando riscos operacionais e otimizando métricas críticas como <span class="highlight">RTO, RPO, MTTR e MTBF</span> em ambientes enterprise.
                </div>
                <div class="bio" style="margin-top:14px;">
                    Tenho trabalhado com <span class="highlight">Kubernetes</span> e automação — mantenho um laboratório SRE prático com cluster Kind, observabilidade completa (Prometheus + Grafana + Loki) e todo o ciclo GitOps com ArgoCD. Também desenvolvo soluções com <span class="highlight">IA e automação</span>, criando engines em PowerShell que transformam logs brutos em dashboards em tempo real.
                </div>
            </div>

            <!-- Tech Stack -->
            <div class="card">
                <div class="section-label">Tech Stack</div>
                <div class="tags">
                    <span class="tag">Kubernetes</span>
                    <span class="tag">Docker</span>
                    <span class="tag">Kind</span>
                    <span class="tag">Terraform</span>
                    <span class="tag">Helm</span>
                    <span class="tag">nginx</span>
                    <span class="tag">PostgreSQL</span>
                    <span class="tag">ArgoCD</span>
                    <span class="tag">GitOps</span>
                    <span class="tag">Prometheus</span>
                    <span class="tag">Grafana</span>
                    <span class="tag">Loki</span>
                    <span class="tag">Kyverno</span>
                    <span class="tag">cert-manager</span>
                    <span class="tag">Cloudflare</span>
                    <span class="tag">PowerShell</span>
                    <span class="tag">Linux (RHEL/Oracle)</span>
                    <span class="tag">Windows Server</span>
                </div>
            </div>

            <!-- Curriculos + Links -->
            <div class="card">
                <div class="section-label">Currículos</div>
                <div class="btn-group">
                    <a href="https://drive.google.com/file/d/1Zbhm9hkdQEvu4AWEoTIGneDyRZHXnx9J/view" target="_blank" class="btn btn-primary">📄 Português (PT-BR)</a>
                    <a href="https://drive.google.com/file/d/1fz-Jb7Til1SDA_M8YvjQ9fOwnLrKJXPF/view" target="_blank" class="btn btn-primary">📄 English (EN-US)</a>
                </div>

                <hr>

                <div class="section-label">Links</div>
                <div class="btn-group">
                    <a href="https://linkedin.com/in/denis93" target="_blank" class="btn">💼 LinkedIn</a>
                    <a href="https://github.com/denoso1993/k8s-portfolio-iac" target="_blank" class="btn">🐙 Cluster K8s (GitHub)</a>
                    <a href="mailto:denis_oliveira@rocketmail.com" class="btn">📧 E-mail</a>
                    <a href="https://drive.google.com/drive/folders/1k_4mO-j4WEoaIGngR9cGLX1WpVSKC-AD" target="_blank" class="btn">📜 Certificações</a>
                </div>
            </div>

            <!-- Cluster Status -->
            <div class="card">
                <div class="section-label">Cluster Status</div>
                <div class="status-grid">
                    <div class="status-item"><span class="dot green"></span>Cluster: Kind</div>
                    <div class="status-item"><span class="dot green"></span>Pods: 15/15 running</div>
                    <div class="status-item"><span class="dot green"></span>Ingress: nginx</div>
                    <div class="status-item"><span class="dot green"></span>Domain: denisdeoliveira.com.br</div>
                    <div class="status-item"><span class="dot green"></span>GitOps: ArgoCD</div>
                    <div class="status-item"><span class="dot green"></span>Tunnel: Cloudflare</div>
                </div>
            </div>

            <!-- Dashboard -->
            <div class="card">
                <div class="section-label">Dashboard</div>
                <div class="dash-placeholder">
                    📊 Dashboard ao vivo em breve<br>
                    <span style="font-size:12px;color:#8c959f;">Monitoramento Prometheus + Grafana sendo configurado</span>
                </div>
            </div>

        </div>
    </body>
    </html>
