    <div style="font-weight:700;font-size:11px;margin-bottom:3px;">Stack do Cluster</div>
    <div class="tg"><span>Kubernetes</span><span>Docker</span><span>Kind</span><span>Helm</span><span>nginx</span><span>PostgreSQL</span><span>ArgoCD</span><span>Prometheus</span><span>Grafana</span><span>Loki</span><span>cert-manager</span><span>Cloudflare</span></div>
    <p style="margin-top:4px;font-size:11px;color:#555;"><strong>Competencias:</strong> K8s, Docker, Terraform, Helm, ArgoCD, Prometheus, Grafana, Linux, PostgreSQL, Cloudflare.</p>
