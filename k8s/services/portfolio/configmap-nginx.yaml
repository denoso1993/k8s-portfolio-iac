    <style>
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{width:100%;height:100%;overflow:hidden!important;font-family:"MS Sans Serif","Microsoft Sans Serif","Courier New",monospace;font-size:12px;}
    #dw{width:1100px;height:1440px;margin:0 auto;transform-origin:top left;position:relative;}
    .d{width:1100px;height:1440px;position:relative;}
    body::before{content:"";position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;background:url("data:image/png;base64,") no-repeat center center/cover;opacity:0.85;}
    .di{position:absolute;top:12px;left:12px;display:flex;flex-direction:column;gap:4px;z-index:2;}
    .di>div{width:72px;height:70px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;color:#fff;font-size:11px;text-align:center;border:1px solid transparent;padding:2px;user-select:none;background:transparent;border-radius:2px;}
    .di>div:hover{border:1px solid #fff;background:rgba(0,0,128,0.2);}
    .di>div img{width:32px;height:32px;margin-bottom:2px;}
    .lbl{line-height:1.15;text-shadow:1px 1px 2px #000;max-width:68px;font-size:11px;color:#fff;font-weight:500;}
    .w{position:absolute;background:#c0c0c0;border:2px solid;border-color:#fff #808080 #808080 #fff;box-shadow:2px 2px 0 0 #404040;display:none;flex-direction:column;z-index:10;min-width:200px;font-size:12px;}
    .w.o{display:flex!important;animation:wa .15s ease-out;}
    @keyframes wa{from{transform:scale(.9);opacity:.5}to{transform:scale(1);opacity:1}}
    .wt{background:linear-gradient(90deg,#000080,#1084d0);color:#fff;font-weight:700;font-size:13px;padding:4px 6px 4px 8px;display:flex;align-items:center;justify-content:space-between;min-height:26px;cursor:default;user-select:none;flex-shrink:0;}
    .btns{display:flex;gap:2px;}
    .btns span{width:16px;height:14px;background:#c0c0c0;border:1px solid;border-color:#fff #808080 #808080 #fff;display:flex;align-items:center;justify-content:center;font-size:10px;color:#000;cursor:default;font-family:monospace;}
    .wb{padding:6px 10px;flex:1;font-size:12px;line-height:1.3;color:#222;overflow:auto;}
    .sb{background:#c0c0c0;border-top:1px solid #fff;padding:2px 8px;display:flex;justify-content:space-between;font-size:11px;color:#444;flex-shrink:0;}
    .term{background:#000;color:#0f0;font-family:"Courier New",monospace;font-size:12px;padding:6px 8px;border:2px solid;border-color:#808080 #fff #fff #808080;flex:1;overflow-y:auto;}
    .term .p{color:#0f0}.term .c{color:#fff}.term .o{color:#0f0;display:block;padding-left:6px;white-space:pre-wrap;line-height:1.35;}
    .blink{animation:bl 1s step-end infinite}@keyframes bl{50%{opacity:0}}
    .tg{display:flex;flex-wrap:wrap;gap:3px;}
    .tg span{background:#fff;border:1px solid;border-color:#808080 #fff #fff #808080;padding:3px 8px;font-size:11px;color:#222;}
    .mb{background:#fff;border:1px solid;border-color:#808080 #fff #fff #808080;padding:2px 6px;text-align:center;display:inline-block;margin:1px;min-width:40px;}
    .mb .n{font-size:16px;font-weight:700;color:#000;display:block;}
    .mb .l{font-size:9px;color:#555;}
    .btn{background:#c0c0c0;border:1px solid;border-color:#fff #808080 #808080 #fff;padding:2px 8px;font:11px inherit;display:inline-flex;align-items:center;gap:3px;text-decoration:none;color:#222;margin:1px;}
    .tb{position:fixed;bottom:0;left:0;right:0;z-index:999;background:#c0c0c0;border-top:2px solid #fff;padding:2px 4px;display:flex;align-items:center;gap:2px;height:28px;}
    .tb .st{background:#c0c0c0;border:1px solid;border-color:#fff #808080 #808080 #fff;padding:1px 8px;font-weight:700;font-size:13px;display:flex;align-items:center;gap:3px;cursor:pointer;height:22px;font-family:inherit;}
    .tb .st img{width:14px;height:14px;}
    .tb .tsk{background:#c0c0c0;border:1px solid;border-color:#fff #808080 #808080 #fff;padding:1px 10px;font-size:11px;display:flex;align-items:center;gap:3px;cursor:pointer;height:22px;white-space:nowrap;}
    .tb .tsk.act{border-color:#808080 #fff #fff #808080;background:#e0e0e0;font-weight:bold;}
    .tb .tm{margin-left:auto;border:1px solid;border-color:#808080 #fff #fff #808080;padding:1px 8px;font-size:11px;background:#c0c0c0;cursor:pointer;height:22px;min-width:50px;display:flex;align-items:center;justify-content:center;}
    #taskitems{display:flex;gap:2px;flex:1;overflow:hidden;}
    .pp{width:70px;height:70px;object-fit:cover;border:2px inset #808080;display:block;}
    .dg{width:8px;height:8px;background:#0a0;border:1px solid #080;display:inline-block;margin-right:3px;vertical-align:middle;}
    a{color:#000080;}
    .cb{width:13px;height:13px;border:1px solid #808080;display:inline-block;}

    /* Start Menu */
    #start-menu{position:fixed;bottom:30px;left:4px;z-index:1000;background:#c0c0c0;border:2px solid;border-color:#fff #808080 #808080 #fff;box-shadow:2px 2px 0 0 #404040;display:none;min-width:180px;font-size:12px;font-family:"MS Sans Serif","Microsoft Sans Serif",sans-serif;}
    #start-menu.show{display:block;}
    #start-menu .title{background:#000080;color:#fff;padding:4px 8px;font-weight:700;font-size:11px;display:flex;align-items:center;gap:6px;}
    #start-menu .items{padding:4px 0;}
    #start-menu .items>div{padding:4px 12px;cursor:pointer;display:flex;align-items:center;gap:8px;font-size:12px;color:#000;font-family:"MS Sans Serif","Microsoft Sans Serif",sans-serif;}
    #start-menu .items>div:hover{background:#000080;color:#fff;}
    #start-menu .items>div .ico{font-size:16px;width:24px;text-align:center;}
    #start-menu .divider{height:1px;background:#808080;margin:3px 8px;border-bottom:1px solid #fff;}
    #start-menu .sub{position:relative;}
    #start-menu .sub::after{content:">";position:absolute;right:8px;color:#000;top:50%;transform:translateY(-50%);}
    #start-menu .submenu{position:absolute;left:100%;top:-4px;background:#c0c0c0;border:2px solid;border-color:#fff #808080 #808080 #fff;box-shadow:2px 2px 0 0 #404040;display:none;min-width:160px;z-index:1001;}
    #start-menu .sub:hover .submenu{display:block;}
    #start-menu .submenu>div{padding:4px 12px;cursor:pointer;display:flex;align-items:center;gap:8px;font-size:12px;white-space:nowrap;color:#000;font-family:"MS Sans Serif","Microsoft Sans Serif",sans-serif;}
    #start-menu .submenu>div:hover{background:#000080;color:#fff;}
















