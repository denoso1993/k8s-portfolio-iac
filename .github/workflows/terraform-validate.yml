name: Validate Terraform
on:
  pull_request:
    branches: [ main ]
    paths:
      - **.tf
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.6.0
    - run: terraform init
    - run: terraform validate
    - run: terraform plan
