apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-html-config
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Denis Oliveira Ramos</title>
        <style>
            @font-face {
                font-family: 'W95';
                src: local('MS Sans Serif'), local('Microsoft Sans Serif'), local('Courier New');
            }

            * { margin:0; padding:0; box-sizing:border-box; }

            body {
                font-family: 'MS Sans Serif', 'Microsoft Sans Serif', 'Courier New', monospace;
                background: #008080;
                min-height: 100vh; overflow-x: hidden;
                font-size: 11px;
                display: flex; flex-direction: column;
            }

            /* ===== DESKTOP ===== */
            .desktop {
                flex: 1;
                padding: 12px;
                display: grid;
                grid-template-columns: 1fr 1fr;
                grid-template-rows: auto auto auto;
                gap: 12px;
                align-content: start;
                max-width: 960px;
                margin: 0 auto;
                width: 100%;
            }

            .window {
                background: #c0c0c0;
                border: 2px solid;
                border-color: #ffffff #808080 #808080 #ffffff;
                box-shadow: 1px 1px 0 0 #404040;
                display: flex;
                flex-direction: column;
                font-size: 11px;
            }
            .window:focus-within { z-index: 1; }

            .window-title {
                background: linear-gradient(90deg, #000080, #1084d0);
                color: #fff;
                font-weight: 700; font-size: 11px;
                padding: 3px 4px 3px 6px;
                display: flex; align-items: center; justify-content: space-between;
                cursor: default;
                user-select: none;
                letter-spacing: 0px;
            }
            .window-title .buttons { display: flex; gap: 2px; }
            .window-title .b {
                width: 14px; height: 13px;
                background: #c0c0c0;
                border: 1px solid;
                border-color: #ffffff #808080 #808080 #ffffff;
                display: flex; align-items: center; justify-content: center;
                font-size: 8px; font-weight: 700; color: #000;
                cursor: pointer; line-height: 1;
                padding: 0;
            }
            .window-title .b:active {
                border-color: #808080 #ffffff #ffffff #808080;
            }
            .window-body {
                padding: 10px 12px 12px;
                flex: 1;
                font-size: 11px;
                line-height: 1.5;
                color: #222;
            }

            .window.full-row { grid-column: 1 / -1; }
            .window.half { grid-column: span 1; }

            /* ===== TITLE BAR ICON ===== */
            .win-icon {
                display: inline-block;
                width: 14px; height: 14px;
                background: #c0c0c0;
                border: 1px solid;
                border-color: #ffffff #808080 #808080 #ffffff;
                text-align: center; font-size: 10px; line-height: 14px;
                margin-right: 4px;
            }

            /* ===== W95 BUTTONS ===== */
            .w95-btn {
                background: #c0c0c0;
                border: 1px solid;
                border-color: #ffffff #808080 #808080 #ffffff;
                padding: 4px 12px;
                font-family: inherit; font-size: 11px;
                cursor: pointer;
                display: inline-flex; align-items: center; gap: 4px;
                text-decoration: none; color: #222;
            }
            .w95-btn:active {
                border-color: #808080 #ffffff #ffffff #808080;
            }
            .w95-btn.primary {
                background: #c0c0c0;
                border-color: #ffffff #808080 #808080 #ffffff;
            }

            /* ===== TABS / SECTIONS ===== */
            .field-row {
                display: flex; flex-wrap: wrap; gap: 4px 8px;
                align-items: center;
            }
            .field-row label {
                font-size: 11px; color: #222;
            }

            /* ===== LISTS ===== */
            .tech-grid {
                display: flex; flex-wrap: wrap; gap: 6px;
                margin-top: 6px;
            }
            .tech-item {
                background: #fff;
                border: 1px solid #808080;
                border-color: #808080 #ffffff #ffffff #808080;
                padding: 2px 8px;
                font-size: 11px;
                color: #222;
            }

            /* ===== METRICS ===== */
            .metric-row {
                display: flex; gap: 16px; flex-wrap: wrap;
                margin: 8px 0;
            }
            .metric-box {
                background: #fff;
                border: 1px solid;
                border-color: #808080 #ffffff #ffffff #808080;
                padding: 6px 12px;
                text-align: center;
                min-width: 60px;
            }
            .metric-box .num { font-size: 18px; font-weight: 700; color: #000; display: block; }
            .metric-box .lbl { font-size: 10px; color: #444; }

            /* ===== STATUS BAR ===== */
            .status-bar {
                background: #c0c0c0;
                border-top: 1px solid #ffffff;
                padding: 2px 6px;
                display: flex; justify-content: space-between;
                font-size: 11px; color: #444;
                margin-top: 4px;
            }
            .status-bar .dot {
                display: inline-block; width: 8px; height: 8px;
                background: #00aa00; border: 1px solid #008800;
                margin-right: 4px; vertical-align: middle;
            }

            /* ===== TASKBAR ===== */
            .taskbar {
                background: #c0c0c0;
                border-top: 2px solid #ffffff;
                padding: 3px 4px;
                display: flex; align-items: center;
                gap: 4px;
                position: sticky; bottom: 0;
            }
            .taskbar .start {
                background: #c0c0c0;
                border: 1px solid;
                border-color: #ffffff #808080 #808080 #ffffff;
                padding: 2px 8px; font-weight: 700;
                font-size: 11px; font-family: inherit;
                display: flex; align-items: center; gap: 4px;
                cursor: pointer;
            }
            .taskbar .start:active {
                border-color: #808080 #ffffff #ffffff #808080;
            }
            .taskbar .task {
                background: #c0c0c0;
                border: 1px solid;
                border-color: #808080 #ffffff #ffffff #808080;
                padding: 2px 10px; font-size: 11px;
                display: flex; align-items: center;
                height: 22px;
            }
            .taskbar .time {
                margin-left: auto;
                border: 1px solid;
                border-color: #808080 #ffffff #ffffff #808080;
                padding: 2px 6px;
                font-size: 11px;
                background: #c0c0c0;
            }

            /* ===== DIVIDER ===== */
            .w95-hr {
                border: none;
                border-top: 1px solid #808080;
                border-bottom: 1px solid #ffffff;
                margin: 8px 0;
            }

            a { color: #000080; }
            a:visited { color: #800080; }

            @media (max-width: 640px) {
                .desktop { grid-template-columns: 1fr; padding: 8px; gap: 8px; }
            }
        </style>
    </head>
    <body>

        <div class="desktop">

            <!-- WINDOW: Sobre (full width) -->
            <div class="window full-row">
                <div class="window-title">
                    <span><span class="win-icon">ℹ</span> denis@denis-pc: ~/sobre</span>
                    <div class="buttons">
                        <span class="b">?</span>
                        <span class="b">✕</span>
                    </div>
                </div>
                <div class="window-body">
                    <div style="display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;">
                        <div style="background:#fff;border:1px solid #808080;padding:2px 6px;font-size:28px;font-weight:700;color:#000080;">DO</div>
                        <div style="flex:1;">
                            <div style="font-size:16px;font-weight:700;color:#000;margin-bottom:2px;">Denis Oliveira Ramos</div>
                            <div style="font-size:12px;color:#444;margin-bottom:6px;">Senior Cloud &amp; Infrastructure Engineer</div>
                            <div class="field-row">
                                <label>📍 Barueri, SP</label>
                                <label>🌐 Inglês C1/C2</label>
                            </div>
                        </div>
                    </div>
                    <div class="w95-hr"></div>
                    <p style="margin-bottom:6px;">
                        Profissional de Infraestrutura Cloud e SRE com foco em <strong>Resiliência, Disaster Recovery</strong> e operações de <strong>alta disponibilidade</strong>. Atuo mitigando riscos operacionais e otimizando métricas críticas como <strong>RTO, RPO, MTTR e MTBF</strong> em ambientes enterprise.
                    </p>
                    <p>
                        Tenho trabalhado com <strong>Kubernetes</strong> e automação — mantenho um laboratório SRE prático com cluster Kind, observabilidade completa (Prometheus + Grafana + Loki) e todo o ciclo GitOps com ArgoCD. Também desenvolvo soluções com IA e automação, criando engines em PowerShell que transformam logs brutos em dashboards em tempo real.
                    </p>
                    <div class="status-bar">
                        <span><span class="dot"></span> Site rodando no cluster Kind · WSL2 · Cloudflare Tunnel</span>
                        <span>💾 15/15 pods online</span>
                    </div>
                </div>
            </div>

            <!-- WINDOW: Tech Stack -->
            <div class="window half">
                <div class="window-title">
                    <span><span class="win-icon">⚙</span> painel-de-controle.exe</span>
                    <div class="buttons"><span class="b">_</span><span class="b">□</span><span class="b">✕</span></div>
                </div>
                <div class="window-body">
                    <div style="font-weight:700;margin-bottom:6px;">Tech Stack</div>
                    <div class="tech-grid">
                        <span class="tech-item">Kubernetes</span>
                        <span class="tech-item">Docker</span>
                        <span class="tech-item">Kind</span>
                        <span class="tech-item">Terraform</span>
                        <span class="tech-item">Helm</span>
                        <span class="tech-item">nginx</span>
                        <span class="tech-item">PostgreSQL</span>
                        <span class="tech-item">ArgoCD</span>
                        <span class="tech-item">GitOps</span>
                        <span class="tech-item">Prometheus</span>
                        <span class="tech-item">Grafana</span>
                        <span class="tech-item">Loki</span>
                        <span class="tech-item">Kyverno</span>
                        <span class="tech-item">cert-manager</span>
                        <span class="tech-item">Cloudflare</span>
                        <span class="tech-item">PowerShell</span>
                        <span class="tech-item">Linux</span>
                        <span class="tech-item">Windows Server</span>
                    </div>
                </div>
            </div>

            <!-- WINDOW: Metrics -->
            <div class="window half">
                <div class="window-title">
                    <span><span class="win-icon">📊</span> Gerenciador de Tarefas</span>
                    <div class="buttons"><span class="b">_</span><span class="b">□</span><span class="b">✕</span></div>
                </div>
                <div class="window-body">
                    <div style="font-weight:700;margin-bottom:4px;">Cluster: lab-sre-denoso</div>
                    <div class="metric-row">
                        <div class="metric-box"><span class="num">15</span><span class="lbl">Pods</span></div>
                        <div class="metric-box"><span class="num">6</span><span class="lbl">Serviços</span></div>
                        <div class="metric-box"><span class="num">3</span><span class="lbl">Namespaces</span></div>
                        <div class="metric-box"><span class="num">99%</span><span class="lbl">Uptime</span></div>
                    </div>
                    <div class="w95-hr"></div>
                    <div style="font-size:11px;">
                        <div>📡 <strong>Cluster:</strong> Kind v1.27.3</div>
                        <div>🌐 <strong>Ingress:</strong> nginx</div>
                        <div>🔁 <strong>GitOps:</strong> ArgoCD</div>
                        <div>🔒 <strong>Tunnel:</strong> Cloudflare</div>
                    </div>
                </div>
            </div>

            <!-- WINDOW: Currículos -->
            <div class="window half">
                <div class="window-title">
                    <span><span class="win-icon">📄</span> Currículos</span>
                    <div class="buttons"><span class="b">_</span><span class="b">□</span><span class="b">✕</span></div>
                </div>
                <div class="window-body">
                    <div style="margin-bottom:8px;">📄 Selecione o idioma:</div>
                    <div class="field-row">
                        <a href="https://drive.google.com/file/d/1Zbhm9hkdQEvu4AWEoTIGneDyRZHXnx9J/view" target="_blank" class="w95-btn">Português (PT-BR)</a>
                        <a href="https://drive.google.com/file/d/1fz-Jb7Til1SDA_M8YvjQ9fOwnLrKJXPF/view" target="_blank" class="w95-btn">English (EN-US)</a>
                    </div>
                </div>
            </div>

            <!-- WINDOW: Links -->
            <div class="window half">
                <div class="window-title">
                    <span><span class="win-icon">🌐</span> Internet Explorer</span>
                    <div class="buttons"><span class="b">_</span><span class="b">□</span><span class="b">✕</span></div>
                </div>
                <div class="window-body">
                    <div class="field-row">
                        <a href="https://linkedin.com/in/denis93" target="_blank" class="w95-btn">💼 LinkedIn</a>
                        <a href="https://github.com/denoso1993/k8s-portfolio-iac" target="_blank" class="w95-btn">🐙 Cluster K8s</a>
                        <a href="mailto:denis_oliveira@rocketmail.com" class="w95-btn">📧 E-mail</a>
                        <a href="https://drive.google.com/drive/folders/1k_4mO-j4WEoaIGngR9cGLX1WpVSKC-AD" target="_blank" class="w95-btn">📜 Certificações</a>
                    </div>
                </div>
            </div>

            <!-- WINDOW: Dashboard -->
            <div class="window full-row">
                <div class="window-title">
                    <span><span class="win-icon">📊</span> Grafana Dashboard (beta)</span>
                    <div class="buttons"><span class="b">_</span><span class="b">□</span><span class="b">✕</span></div>
                </div>
                <div class="window-body" style="text-align:center;padding:16px;">
                    <div style="font-size:24px;margin-bottom:4px;">📊</div>
                    <div><strong>Dashboard ao vivo em breve</strong></div>
                    <div style="color:#666;margin-top:2px;">Monitoramento Prometheus + Grafana sendo configurado</div>
                </div>
                <div class="status-bar">
                    <span>Para atualizar, pressione F5</span>
                    <span>📡 Conectado</span>
                </div>
            </div>

        </div>

        <!-- TASKBAR -->
        <div class="taskbar">
            <button class="start" onclick="alert('Iniciar - Windows 95 ♥ K8s')">
                <span style="font-size:13px;">🪟</span> Iniciar
            </button>
            <div class="task">📄 denis@denis-pc: ~</div>
            <div class="task">📊 Gerenciador de Tarefas</div>
            <div class="task">🌐 Internet Explorer</div>
            <div class="time" id="clock">00:00</div>
        </div>

        <script>
            function updateClock() {
                const d = new Date();
                document.getElementById('clock').textContent =
                    d.getHours().toString().padStart(2,'0') + ':' +
                    d.getMinutes().toString().padStart(2,'0');
            }
            updateClock();
            setInterval(updateClock, 10000);
        </script>
    </body>
    </html>
