data:
  index.html: |-
    <!DOCTYPE html>
    <html><head>
    <meta charset="UTF-8">
    <title>Denis Oliveira Ramos</title>
    <style>
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{width:100%;height:100%;overflow:hidden;font-family:"MS Sans Serif","Microsoft Sans Serif","Courier New",monospace;font-size:12px;}
    #dw{width:1100px;height:1440px;margin:0 auto;transform-origin:top left;position:relative;}
    .d{width:1100px;height:1440px;position:relative;background:#008080 url("data:image/png;base64,") no-repeat center center/cover;}
    .di{position:absolute;top:12px;left:12px;display:flex;flex-direction:column;gap:4px;z-index:2;}
    .di>div{width:72px;height:70px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;color:#fff;font-size:11px;text-align:center;border:1px solid transparent;padding:2px;user-select:none;background:rgba(0,0,0,0.1);border-radius:2px;}
    .di>div:hover{border:1px solid #fff;background:rgba(0,0,128,0.2);}
    .di>div img{width:32px;height:32px;margin-bottom:2px;filter:drop-shadow(0 1px 3px rgba(0,0,0,0.6));}
    .lbl{line-height:1.15;text-shadow:1px 1px 2px #000;max-width:68px;font-size:11px;color:#fff;font-weight:500;}
    .w{position:absolute;background:#c0c0c0;border:2px solid;border-color:#fff #808080 #808080 #fff;box-shadow:2px 2px 0 0 #404040;display:none;flex-direction:column;z-index:10;min-width:200px;font-size:12px;}
    .w.o{display:flex!important;animation:wa .15s ease-out;}
    @keyframes wa{from{transform:scale(.9);opacity:.5}to{transform:scale(1);opacity:1}}
    .wt{background:linear-gradient(90deg,#000080,#1084d0);color:#fff;font-weight:700;font-size:13px;padding:4px 6px 4px 8px;display:flex;align-items:center;justify-content:space-between;min-height:26px;cursor:default;user-select:none;flex-shrink:0;}
    .btns{display:flex;gap:2px;}
    .btns span{width:16px;height:14px;background:#c0c0c0;border:1px solid;border-color:#fff #808080 #808080 #fff;display:flex;align-items:center;justify-content:center;font-size:10px;color:#000;cursor:default;font-family:monospace;}
    .wb{padding:6px 10px;flex:1;font-size:12px;line-height:1.3;color:#222;overflow:auto;}
    .sb{background:#c0c0c0;border-top:1px solid #fff;padding:2px 8px;display:flex;justify-content:space-between;font-size:11px;color:#444;flex-shrink:0;}
    .term{background:#000;color:#0f0;font-family:"Courier New",monospace;font-size:12px;padding:6px 8px;border:2px solid;border-color:#808080 #fff #fff #808080;flex:1;overflow-y:auto;}
    .term .p{color:#0f0}.term .c{color:#fff}.term .o{color:#0f0;display:block;padding-left:6px;white-space:pre-wrap;line-height:1.35;}
    .blink{animation:bl 1s step-end infinite}@keyframes bl{50%{opacity:0}}
    .tg{display:flex;flex-wrap:wrap;gap:3px;}
    .tg span{background:#fff;border:1px solid;border-color:#808080 #fff #fff #808080;padding:3px 8px;font-size:11px;color:#222;}
    .mb{background:#fff;border:1px solid;border-color:#808080 #fff #fff #808080;padding:2px 6px;text-align:center;display:inline-block;margin:1px;min-width:40px;}
    .mb .n{font-size:16px;font-weight:700;color:#000;display:block;}
    .mb .l{font-size:9px;color:#555;}
    .btn{background:#c0c0c0;border:1px solid;border-color:#fff #808080 #808080 #fff;padding:2px 8px;font:11px inherit;display:inline-flex;align-items:center;gap:3px;text-decoration:none;color:#222;margin:1px;}
    .tb{position:fixed;bottom:0;left:0;right:0;z-index:999;background:#c0c0c0;border-top:2px solid #fff;padding:2px 4px;display:flex;align-items:center;gap:2px;height:28px;}
    .tb .st{background:#c0c0c0;border:1px solid;border-color:#fff #808080 #808080 #fff;padding:1px 8px;font-weight:700;font-size:13px;display:flex;align-items:center;gap:3px;cursor:pointer;height:22px;font-family:inherit;}
    .tb .st img{width:14px;height:14px;vertical-align:middle;}
    .tb .tsk{background:#c0c0c0;border:1px solid;border-color:#808080 #fff #fff #808080;padding:1px 10px;font-size:11px;display:flex;align-items:center;gap:3px;cursor:pointer;height:22px;}
    .tb .tsk.act{border-color:#fff #808080 #808080 #fff;background:#e0e0e0;font-weight:bold;}
    .tb .tm{margin-left:auto;border:1px solid;border-color:#808080 #fff #fff #808080;padding:1px 8px;font-size:11px;background:#c0c0c0;cursor:pointer;height:22px;min-width:50px;text-align:center;display:flex;align-items:center;justify-content:center;}
    .pp{width:70px;height:70px;object-fit:cover;border:2px inset #808080;display:block;}
    .dg{width:8px;height:8px;background:#0a0;border:1px solid #080;display:inline-block;margin-right:3px;vertical-align:middle;}
    a{color:#000080;}
    .pm{display:flex;gap:5px;font-size:11px;flex-shrink:0;border-bottom:1px solid #808080;padding:2px 6px;background:#c0c0c0;}
    .pm span{padding:1px 6px;}
    .cb{width:13px;height:13px;border:1px solid #808080;display:inline-block;}
    </style></head><body>
    <div id="dw"><div class="d">
    <div class="di">
      <div onclick="oo('x')"><img src="data:image/png;base64," alt=""><div class="lbl">Sobre</div></div>
      <div onclick="oo('l')"><img src="data:image/png;base64," alt=""><div class="lbl">Links</div></div>
      <div onclick="oo('d')"><img src="data:image/png;base64," alt=""><div class="lbl">Gerenciador de Dispositivos</div></div>
      <div onclick="oo('t')"><img src="data:image/png;base64," alt=""><div class="lbl">Command Prompt</div></div>
      <div onclick="oo('a')"><img src="data:image/png;base64," alt=""><div class="lbl">Paint</div></div>
    </div>
    <div class="w o" id="x" style="width:780px;height:380px;top:30px;left:100px;z-index:11;" data-win="Sobre">
    <div class="wt"><span>  Sobre - Denis Oliveira Ramos</span><div class="btns"><span class="minbtn">_</span><span onclick="xx('x')">X</span></div></div>
    <div class="wb" style="padding:10px 14px;font-size:12px;">
    <div style="display:flex;gap:12px;">
      <img src="https://i.imgur.com/lJoDtkK.jpeg" class="pp">
      <div style="flex:1;"><div style="font-size:16px;font-weight:700;">Denis Oliveira Ramos</div>
        <div style="font-size:12px;color:#444;">Senior Cloud and Infrastructure Engineer</div>
        <div style="font-size:11px;color:#666;margin-top:2px;">Barueri, SP | Ingles C1/C2 | 8+ anos de experiencia</div></div>
    </div>
    <div style="font-size:12px;line-height:1.5;margin-top:6px;">
    <p style="margin-bottom:3px;"><strong>Sobre mim</strong></p>
    <p style="margin-bottom:3px;">Profissional de Infraestrutura Cloud com especializacao em ambientes Linux, Bancos de Dados e Cloud Native. Experiencia em Cloud Infrastructure, SRE e engenharia de plataforma.</p>
    <p style="margin-bottom:3px;">Minha abordagem e pratica e analitica, focada em entregar solucoes escalaveis e automatizadas. Portfolio: cluster K8s declarativo com IaC, observabilidade e GitOps. Tudo rodando no WSL2.</p>
    <hr style="border:none;border-top:1px solid #808080;margin:4px 0;">
    <div style="font-weight:700;font-size:11px;margin-bottom:3px;">Stack do Cluster</div>
    <div class="tg"><span>Kubernetes</span><span>Docker</span><span>Kind</span><span>Helm</span><span>nginx</span><span>PostgreSQL</span><span>ArgoCD</span><span>Prometheus</span><span>Grafana</span><span>Loki</span><span>cert-manager</span><span>Cloudflare</span></div>
    <p style="margin-top:4px;font-size:11px;color:#555;"><strong>Competencias:</strong> K8s, Docker, Terraform, Helm, ArgoCD, Prometheus, Grafana, Linux, PostgreSQL, Cloudflare.</p>
    </div></div>
    <div class="sb"><span><span class="dg"></span> Online - Kind - Cloudflare - WSL2</span><span>Live</span></div></div>
    <div class="w" id="t" style="width:520px;height:460px;top:60px;left:80px;z-index:5;" data-win="Command Prompt">
    <div class="wt"><span>  Command Prompt - kubectl</span><div class="btns"><span class="minbtn">_</span><span onclick="xx('t')">X</span></div></div>
    <div class="term"><span class="p">C:\&gt; </span><span class="c">kubectl get pods -A</span>
    <span id="po" class="o">Carregando...</span><span class="o"></span>
    <span class="p">C:\&gt; </span><span class="c">kubectl get nodes</span>
    <span id="no" class="o">Carregando...</span><span class="o"></span>
    <span class="p">C:\&gt; <span class="blink">_</span></span></div></div>
    <div class="w" id="d" style="width:350px;height:240px;top:350px;left:80px;z-index:4;" data-win="Gerenciador de Dispositivos">
    <div class="wt"><span>  Gerenciador de Dispositivos</span><div class="btns"><span class="minbtn">_</span><span onclick="xx('d')">X</span></div></div>
    <div class="wb" style="padding:6px 10px;font-size:11px">
    <div style="font-weight:700;font-size:13px;margin-bottom:4px;color:#000080;">lab-sre-denoso - Kind v1.27.3</div>
    <div style="display:flex;gap:4px;flex-wrap:wrap;">
    <span class="mb"><span class="n" id="dp">15</span><span class="l">Pods</span></span>
    <span class="mb"><span class="n" id="ds">-</span><span class="l">Svcs</span></span>
    <span class="mb"><span class="n" id="dno">1</span><span class="l">No</span></span></div>
    <div style="border-top:1px solid #808080;border-bottom:1px solid #fff;padding-top:3px;margin-bottom:3px;"></div>
    <div style="font-size:11px;line-height:1.5;">
    <div>&gt; <strong>Cluster:</strong> Kind (WSL2) - K8s v1.27.3</div>
    <div>&gt; <strong>DB:</strong> PostgreSQL 15 - StatefulSet</div>
    <div>&gt; <strong>Monitor:</strong> Prometheus + Grafana</div>
    </div></div></div>
    <div class="w" id="l" style="width:270px;height:290px;top:310px;left:640px;z-index:4;" data-win="Links">
    <div class="wt"><span>  Links</span><div class="btns"><span class="minbtn">_</span><span onclick="xx('l')">X</span></div></div>
    <div class="wb" style="padding:6px 10px">
    <div style="font-weight:700;margin-bottom:2px;">Curriculos</div>
    <a href="https://drive.google.com/drive/folders/1HsHI4QwXOS5NkfCRBcZzUDqrOpnHI1OV" target="_blank" class="btn">Curriculo PT-BR / EN-US</a>
    <div style="font-weight:700;margin:4px 0 2px;">Links</div>
    <a href="https://linkedin.com/in/denis93" target="_blank" class="btn">LinkedIn</a>
    <a href="https://github.com/denoso1993/k8s-portfolio-iac" target="_blank" class="btn">Cluster K8s Github</a>
    <a href="mailto:denis@denisdeoliveira.com.br" class="btn">Email</a>
    <a href="https://drive.google.com/drive/folders/1FcYD8bK9-_ELUoMHFNZzyWU-5mOJTy3H" target="_blank" class="btn">Projetos + Scripts</a>
    <a href="https://drive.google.com/drive/folders/1k_4mO-j4WEoaIGngR9cGLX1WpVSKC-AD" target="_blank" class="btn">Certificados</a>
    <a href="https://drive.google.com/drive/folders/1yI8Hf9Ku_jncA5YtFkkkc0zN3oq1j5Xv" target="_blank" class="btn">Cert. English Proficiency</a>
    </div></div>
    <div class="w" id="a" style="width:900px;height:400px;top:120px;left:110px;z-index:3;" data-win="Paint">
    <div class="wt"><span>  paint.exe - grafana-dashboard</span><div class="btns"><span class="minbtn">_</span><span onclick="xx('a')">X</span></div></div>
    <div class="pm"><span>Arquivo</span><span>Editar</span><span>Exibir</span><span>Imagem</span><span>Opcoes</span><span>Ajuda</span></div>
    <div style="display:flex;flex:1;border:2px solid;border-color:#808080 #fff #fff #808080;margin:3px;background:#c0c0c0;">
    <div style="background:#c0c0c0;border:1px solid;border-color:#fff #808080 #808080 #fff;display:grid;grid-template-columns:1fr 1fr;gap:2px;padding:2px;width:48px;">
    <span style="height:20px;display:flex;align-items:center;justify-content:center;font-size:10px;background:#c0c0c0;border:1px solid;border-color:#fff #808080 #808080 #fff;">/</span>
    <span style="height:20px;display:flex;align-items:center;justify-content:center;font-size:10px;background:#c0c0c0;border:1px solid;border-color:#fff #808080 #808080 #fff;">\</span></div>
    <div style="flex:1;margin:3px;background:#fff;border:1px solid;border-color:#808080 #fff #fff #808080;overflow:hidden;">
    <iframe src="https://grafana.denisdeoliveira.com.br/d/cluster-sre/cluster-sre?orgId=1&kiosk=tv" width="100%" height="310" frameborder="0" style="display:block;width:100%;height:100%;border:none;"></iframe>
    </div></div>
    <div style="background:#c0c0c0;border-top:1px solid #fff;padding:2px 6px;display:flex;align-items:center;gap:3px;">
    <div style="border:1px solid;border-color:#fff #808080 #808080 #fff;padding:2px;background:#fff;display:flex;"><div style="width:12px;height:12px;background:#000;border:1px solid #808080;"></div></div>
    <div style="display:flex;flex-wrap:wrap;gap:1px;"><span class="cb" style="background:#000;"></span><span class="cb" style="background:#fff;"></span><span class="cb" style="background:#808080;"></span><span class="cb" style="background:#800000;"></span><span class="cb" style="background:#008000;"></span><span class="cb" style="background:#000080;"></span><span class="cb" style="background:#008080;"></span><span class="cb" style="background:#c0c0c0;"></span></div>
    </div>
    <div class="sb"><span>640x480 - 256 cores</span><span>F1</span></div></div>
    </div></div>
    <div class="tb">
    <div class="st" onclick="alert('Windows 95 + Kubernetes')"><img src="data:image/svg+xml;base64," alt=""> Iniciar</div>
    <div id="taskitems"></div>
    <div class="tm" id="cl"></div>
    </div>
    <script>
    function uc(){var d=new Date();document.getElementById("cl").textContent=d.getHours().toString().padStart(2,"0")+":"+d.getMinutes().toString().padStart(2,"0");}uc();setInterval(uc,10000);
    var z=20;var wins={};
    function ff(el){while(el&&!el.classList.contains("w"))el=el.parentNode;if(el){z++;el.style.zIndex=z;}}
    function oo(id){var w=document.getElementById(id);if(!w)return;ff(w);
    if(w.classList.contains("o")){w.style.display="none";w.classList.remove("o");updtask(id,false);return;}
    w.classList.add("o");updtask(id,true);}
    function xx(id){var w=document.getElementById(id);if(!w)return;w.classList.remove("o");w.style.display="none";updtask(id,false);}
    function mn(el){var w=el;while(w&&!w.classList.contains("w"))w=w.parentNode;if(w){w.classList.remove("o");w.style.display="none";updtask(w.id,false);}}
    function updtask(id,show){var tb=document.getElementById("taskitems");
    var existing=document.getElementById("tb-"+id);
    if(existing&&!show){existing.remove();return;}
    if(existing)return;
    var w=document.getElementById(id);if(!w)return;
    var name=w.getAttribute("data-win")||id;
    var btn=document.createElement("div");
    btn.className="tsk act";btn.id="tb-"+id;
    btn.textContent=name;
    btn.onclick=function(){
      var w2=document.getElementById(id);if(!w2)return;
      if(w2.classList.contains("o")){w2.style.display="none";w2.classList.remove("o");this.classList.remove("act");}
      else{w2.classList.add("o");w2.style.display="flex";ff(w2);this.classList.add("act");}
    };
    tb.appendChild(btn);}
    document.addEventListener("mousedown",function(e){
      var wt=e.target.closest(".wt");if(!wt||e.target.closest(".btns"))return;
      var w=wt.parentNode;ff(w);var r=w.getBoundingClientRect();
      var dx=e.clientX-r.left,dy=e.clientY-r.top;
      function m(me){w.style.left=Math.max(0,me.clientX-dx)+"px";w.style.top=Math.max(0,me.clientY-dy)+"px";}
      function up(){document.removeEventListener("mousemove",m);document.removeEventListener("mouseup",up);}
      document.addEventListener("mousemove",m);document.addEventListener("mouseup",up);
    });
    document.addEventListener("mousedown",function(e){var w=e.target.closest(".w");if(w)ff(w);},true);
    document.addEventListener("click",function(e){if(e.target.classList.contains("minbtn")){var w=e.target.closest(".w");if(w){w.classList.remove("o");w.style.display="none";updtask(w.id,false);}}})
    async function k(){
      try{var r=await fetch("/k8s/api/v1/pods?limit=100");var d=await r.json();
      document.getElementById("po").textContent=d.items.map(function(x){return(x.metadata.namespace+"       ").slice(0,12)+" "+(x.metadata.name+"                       ").slice(0,28)+" "+(x.status.phase=="Running"?"1/1":"0/1")+"  "+x.status.phase;}).join("\n");}
      catch(e){document.getElementById("po").textContent="API: "+e.message;}
      try{var r2=await fetch("/k8s/api/v1/nodes");var d2=await r2.json();
      document.getElementById("no").textContent=d2.items.map(function(n){var c=n.status.conditions.find(function(x){return x.type=="Ready";});return(n.metadata.name+"          ").slice(0,28)+" "+(c&&c.status=="True"?"Ready":"NotReady");}).join("\n");}
      catch(e){}}
    k();setInterval(k,15000);
    async function ud(){try{var r=await fetch("/k8s/api/v1/pods?limit=200");var d=await r.json();var e=document.getElementById("dp");if(e)e.textContent=d.items.length;}catch(e){}
    try{var r2=await fetch("/k8s/api/v1/nodes");var d2=await r2.json();var e=document.getElementById("dno");if(e)e.textContent=d2.items.length;}catch(e){}}
    ud();
    (function(){var w=document.getElementById("dw");if(!w)return;function s(){var sc=Math.min(window.innerWidth/1100,1);w.style.transform="scale("+sc+")";w.style.margin="0";document.body.style.overflow=sc<1?"hidden":"auto";}s();window.addEventListener("resize",s);})();
    // Init SOBRE taskbar button
    setTimeout(function(){updtask("x",true);},100);
    </script></body></html>
kind: ConfigMap
