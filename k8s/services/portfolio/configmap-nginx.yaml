      {"apiVersion":"v1","data":{"index.html":"\u003c!DOCTYPE html\u003e\n\u003chtml\u003e\n\u003chead\u003e\n\u003cmeta charset=\"UTF-8\"\u003e\n\u003cscript\u003edocument.write('\u003cstyle id=\"scale-style\"\u003e#desktop-wrap{transform:scale('+(Math.min(window.innerWidth/1100,1))+');width:1100px;transform-origin:top left;margin:0;}\u003c/style\u003e');\u003c/script\u003e\n\n\u003cmeta http-equiv=\"X-Frame-Options\" content=\"DENY\"\u003e\n\u003cmeta http-equiv=\"X-Content-Type-Options\" content=\"nosniff\"\u003e\n\u003cmeta http-equiv=\"Referrer-Policy\" content=\"no-referrer-when-downgrade\"\u003e\n\u003cmeta http-equiv=\"Content-Security-Policy\" content=\"default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:; frame-src https://grafana.denisdeoliveira.com.br; connect-src 'self' /k8s/; font-src 'self'; form-action 'self';\"\u003e\n\u003ctitle\u003eDenis Oliveira Ramos\u003c/title\u003e\n\u003clink rel=\"icon\" type=\"image/png\" href=\"data:image/png;base64,\"\u003e\n\u003cstyle\u003e\n*{margin:0;padding:0;box-sizing:border-box}\nhtml,body{width:100%;height:100%}\nbody{\n  background:#008080;\n  font-family:'MS Sans Serif','Courier New',monospace;\n  font-size:13px;\n  overflow-y:auto;\n  overflow-x:hidden;\n  padding:16px 16px 48px;\n  min-height:100vh;\n}\n\n/* Desktop flex container */\n.desktop{\n  max-width:1100px;\n  margin:0 auto;\n  display:flex;\n  flex-direction:column;\n  gap:12px;\n}\n\n/* Row for horizontal grouping */\n.row{\n  display:flex;\n  flex-wrap:wrap;\n  gap:12px;\n}\n\n/* Column variants */\n.col{flex:1;min-width:280px;display:flex;flex-direction:column;}\n.col-2{flex:2;min-width:350px;display:flex;flex-direction:column;}\n.col-3{flex:3;min-width:300px;display:flex;flex-direction:column;}\n\n/* Win95 window */\n.w{\n  position:relative;\n  background:#c0c0c0;\n  border:2px solid;\n  border-color:#fff #808080 #808080 #fff;\n  box-shadow:2px 2px 0 0 #404040;\n  display:flex;\n  flex-direction:column;\n  width:100%;\n  min-height:100px;\n}\n\n/* Title bar */\n.wt{\n  background:linear-gradient(90deg,#000080,#1084d0);\n  color:#fff;\n  font-weight:700;\n  font-size:14px;\n  padding:5px 8px 5px 10px;\n  display:flex;\n  align-items:center;\n  justify-content:space-between;\n  min-height:28px;\n  cursor:default;\n  user-select:none;\n  flex-shrink:0;\n}\n.wt .btns{display:flex;gap:2px;flex-shrink:0}\n.wt .btns span{\n  width:18px;height:16px;background:#c0c0c0;\n  border:1px solid;border-color:#fff #808080 #808080 #fff;\n  display:flex;align-items:center;justify-content:center;\n  font-size:11px;color:#000;\n}\n\n/* Window body */\n.wb{padding:8px 12px;flex:1;font-size:12px;line-height:1.3;color:#222;overflow:auto;}\n\n/* Status bar */\n.sb{\n  background:#c0c0c0;border-top:1px solid #fff;\n  padding:2px 8px;display:flex;justify-content:space-between;\n  font-size:11px;color:#444;flex-shrink:0;\n}\n\n/* Terminal */\n.term{\n  background:#000;color:#0f0;font-family:'Courier New',monospace;font-size:12px;\n  padding:8px 10px;\n  border:2px solid;border-color:#808080 #fff #fff #808080;\n  flex:1;overflow-y:auto;overflow-x:auto;\n}\n.term .p{color:#0f0}.term .c{color:#fff}.term .o{\n  color:#0f0;display:block;padding-left:8px;white-space:pre-wrap;word-break:break-all;font-size:12px;line-height:1.4;\n}\n\n/* Blink cursor */\n.blink{animation:blink 1s step-end infinite}\n@keyframes blink{50%{opacity:0}}\n\n/* Tag cloud */\n.tg{display:flex;flex-wrap:wrap;gap:3px;align-content:flex-start;}\n.tg span{\n  background:#fff;border:1px solid;border-color:#808080 #fff #fff #808080;\n  padding:3px 8px;font-size:11px;color:#222;\n}\n\n/* Metric box */\n.mbox{\n  background:#fff;border:1px solid;border-color:#808080 #fff #fff #808080;\n  padding:3px 8px;text-align:center;display:inline-block;margin:1px;min-width:42px;\n}\n.mbox .n{font-size:18px;font-weight:700;color:#000;display:block;}\n.mbox .l{font-size:9px;color:#555;}\n\n/* Win95 button */\n.w95-btn{\n  background:#c0c0c0;border:1px solid;border-color:#fff #808080 #808080 #fff;\n  padding:3px 10px;font-family:inherit;font-size:11px;\n  display:inline-flex;align-items:center;gap:4px;\n  text-decoration:none;color:#222;margin:1px;\n}\n\n/* Taskbar */\n.taskbar{\n  position:fixed;bottom:0;left:0;right:0;z-index:999;\n  background:#c0c0c0;border-top:2px solid #fff;\n  padding:3px 6px;display:flex;align-items:center;gap:4px;height:30px;\n}\n.taskbar .start{\n  background:#c0c0c0;border:1px solid;border-color:#fff #808080 #808080 #fff;\n  padding:2px 10px;font-weight:700;font-size:13px;font-family:inherit;\n  display:flex;align-items:center;gap:4px;cursor:pointer;height:22px;\n}\n.taskbar .task{\n  background:#c0c0c0;border:1px solid;border-color:#808080 #fff #fff #808080;\n  padding:2px 12px;font-size:11px;display:flex;align-items:center;\n}\n.taskbar .time{\n  margin-left:auto;border:1px solid;border-color:#808080 #fff #fff #808080;\n  padding:2px 8px;font-size:11px;background:#c0c0c0;cursor:pointer;\n}\n\n/* PAINT toolbar */\n.paint-toolbar{\n  background:#c0c0c0;border:1px solid;border-color:#fff #808080 #808080 #fff;\n  padding:3px;display:grid;grid-template-columns:1fr 1fr;gap:2px;\n  width:54px;flex-shrink:0;align-content:start;\n}\n.paint-toolbar span{\n  width:23px;height:23px;background:#c0c0c0;\n  border:1px solid;border-color:#fff #808080 #808080 #fff;\n  display:flex;align-items:center;justify-content:center;\n}\n.paint-menu{padding:2px 6px;display:flex;gap:8px;font-size:11px;flex-shrink:0;}\n.paint-menu span{padding:1px 8px;}\n.paint-canvas{flex:1;margin:3px;background:#fff;border:1px solid;border-color:#808080 #fff #fff #808080;overflow:hidden;}\n.color-box{width:14px;height:14px;border:1px solid #808080;}\n\n/* Profile photo */\n.profile-photo{\n  width:80px;height:80px;object-fit:cover;\n  border:2px inset #808080;display:block;\n}\n\n/* Green dot */\n.dot-g{width:7px;height:7px;background:#0a0;border:1px solid #080;display:inline-block;margin-right:3px;vertical-align:middle;}\n\n/* Links */\na{color:#000080;}\n\n#desktop-wrap{width:1100px;margin:0 auto;transform-origin:top left;}\n\n\u003c/style\u003e\n\u003c/head\u003e\n\u003cbody\u003e\n\n\u003cdiv id=\"desktop-wrap\"\u003e\u003cdiv class=\"desktop\"\u003e\n\n\u003c!-- ROW 1: SOBRE + LINKS --\u003e\n\u003cdiv class=\"row\"\u003e\n  \u003cdiv class=\"col-3\"\u003e\n    \u003cdiv class=\"w\"\u003e\n      \u003cdiv class=\"wt\"\u003e\u003cspan\u003e\u0026#x1F5AA; Sobre - Denis Oliveira Ramos\u003c/span\u003e\u003cdiv class=\"btns\"\u003e\u003cspan\u003e_\u003c/span\u003e\u003cspan\u003e\u0026#x25A1;\u003c/span\u003e\u003cspan\u003e\u0026#x2715;\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\n      \u003cdiv class=\"wb\" style=\"padding:12px 16px;font-size:15px;line-height:1.5\"\u003e\n        \u003ctable width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" style=\"border:none;\"\u003e\n          \u003ctr\u003e\n            \u003ctd valign=\"top\" width=\"95\" style=\"padding-right:18px;\"\u003e\n              \u003cimg src=\"https://i.imgur.com/lJoDtkK.jpeg\" class=\"profile-photo\" alt=\"Denis\"\u003e\n            \u003c/td\u003e\n            \u003ctd valign=\"top\"\u003e\n              \u003cdiv style=\"font-size:20px;font-weight:700;margin-bottom:1px;\"\u003eDenis Oliveira Ramos\u003c/div\u003e\n              \u003cdiv style=\"font-size:13px;color:#444;margin-bottom:2px;\"\u003eSenior Cloud \u0026amp; Infrastructure Engineer\u003c/div\u003e\n              \u003cdiv style=\"font-size:12px;color:#666;margin-bottom:6px;\"\u003e\n                \u0026#x1F4CD; Barueri, SP \u0026middot; \u0026#x1F310; Ingl\u0026ecirc;s C1/C2 \u0026middot; \u0026#x1F4C5; 8+ anos de experiencia\n              \u003c/div\u003e\n            \u003c/td\u003e\n          \u003c/tr\u003e\n        \u003c/table\u003e\n        \u003cdiv style=\"font-size:14px;line-height:1.6;\"\u003e\n          \u003cp style=\"margin-bottom:4px;\"\u003e\u003cstrong\u003eSobre mim\u003c/strong\u003e\u003c/p\u003e\n          \u003cp style=\"margin-bottom:4px;\"\u003eProfissional de Infraestrutura Cloud com forte especializa\u0026ccedil;\u0026atilde;o em ambientes \u003cstrong\u003eLinux\u003c/strong\u003e, \u003cstrong\u003eBancos de Dados\u003c/strong\u003e e ecossistemas \u003cstrong\u003eCloud Native\u003c/strong\u003e. Atualmente dispon\u0026iacute;vel para novos desafios, com experi\u0026ecirc;ncia em \u003cstrong\u003eCloud Infrastructure\u003c/strong\u003e, \u003cstrong\u003eSRE\u003c/strong\u003e e engenharia de plataforma.\u003c/p\u003e\n          \u003cp style=\"margin-bottom:4px;\"\u003eMinha abordagem \u0026eacute; pr\u0026aacute;tica e anal\u0026iacute;tica, focada em entregar solu\u0026ccedil;\u0026otilde;es escal\u0026aacute;veis e automatizadas. Este portf\u0026oacute;lio \u0026eacute; a \u003cstrong\u003eprova de conceito\u003c/strong\u003e \u0026mdash; uma aplica\u0026ccedil;\u0026atilde;o hospedada em cluster Kubernetes 100% declarativo, mantido via \u003cstrong\u003eIaC\u003c/strong\u003e com \u003cstrong\u003eTerraform\u003c/strong\u003e e \u003cstrong\u003eHelm\u003c/strong\u003e, com observabilidade completa via \u003cstrong\u003ePrometheus + Grafana + Loki\u003c/strong\u003e e GitOps com \u003cstrong\u003eArgoCD\u003c/strong\u003e. \u003cstrong\u003eTudo rodando no WSL2.\u003c/strong\u003e\u003c/p\u003e\n          \u003cp style=\"margin-bottom:0;\"\u003e\u003cstrong\u003ePrincipais compet\u0026ecirc;ncias:\u003c/strong\u003e Kubernetes, Docker, Terraform, Helm, ArgoCD, GitOps, Prometheus, Grafana, Linux (RHEL/Oracle), Windows Server, PostgreSQL, SQL Server, PowerShell, Cloudflare, NetworkPolicies, Disaster Recovery, RTO/RPO/MTTR.\u003c/p\u003e\n        \u003c/div\u003e\n      \u003c/div\u003e\n      \u003cdiv class=\"sb\"\u003e\u003cspan\u003e\u003cspan class=\"dot-g\"\u003e\u003c/span\u003e Online \u0026middot; Kind \u0026middot; Cloudflare \u0026middot; WSL2\u003c/span\u003e\u003cspan\u003e15/15 pods \u0026middot; \u0026#x1F4E1; Live\u003c/span\u003e\u003c/div\u003e\n    \u003c/div\u003e\n  \u003c/div\u003e\n  \u003cdiv class=\"col\"\u003e\n    \u003cdiv class=\"w\"\u003e\n      \u003cdiv class=\"wt\"\u003e\u003cspan\u003e\u0026#x1F4C4; Links\u003c/span\u003e\u003cdiv class=\"btns\"\u003e\u003cspan\u003e_\u003c/span\u003e\u003cspan\u003e\u0026#x25A1;\u003c/span\u003e\u003cspan\u003e\u0026#x2715;\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\n      \u003cdiv class=\"wb\" style=\"padding:6px 10px\"\u003e\n        \u003cdiv style=\"font-weight:700;margin-bottom:2px;\"\u003eCurr\u0026iacute;culos\u003c/div\u003e\n        \u003ca href=\"https://drive.google.com/drive/folders/1HsHI4QwXOS5NkfCRBcZzUDqrOpnHI1OV\" target=\"_blank\" class=\"w95-btn\"\u003e\u0026#x1F4C4; Curriculo PT-BR / EN-US\u003c/a\u003e\n        \u003cdiv style=\"font-weight:700;margin:4px 0 2px;\"\u003eLinks\u003c/div\u003e\n        \u003ca href=\"https://linkedin.com/in/denis93\" target=\"_blank\" class=\"w95-btn\"\u003e\u0026#x1F4BC; LinkedIn\u003c/a\u003e\n        \u003ca href=\"https://github.com/denoso1993/k8s-portfolio-iac\" target=\"_blank\" class=\"w95-btn\"\u003e\u0026#x1F419; Cluster K8s Github\u003c/a\u003e\n        \u003ca href=\"mailto:denis_oliveira@rocketmail.com\" class=\"w95-btn\"\u003e\u0026#x1F4E7; Email\u003c/a\u003e\n        \u003ca href=\"https://drive.google.com/drive/folders/1FcYD8bK9-_ELUoMHFNZzyWU-5mOJTy3H\" target=\"_blank\" class=\"w95-btn\"\u003e\u0026#x1F4C1; Projetos + Scripts\u003c/a\u003e\n        \u003ca href=\"https://drive.google.com/drive/folders/1k_4mO-j4WEoaIGngR9cGLX1WpVSKC-AD\" target=\"_blank\" class=\"w95-btn\"\u003e\u0026#x1F4DC; Certificados\u003c/a\u003e\n        \u003ca href=\"https://drive.google.com/drive/folders/1yI8Hf9Ku_jncA5YtFkkkc0zN3oq1j5Xv\" target=\"_blank\" class=\"w95-btn\"\u003e\u0026#x1F310; Cert. English Proficiency\u003c/a\u003e\n      \u003c/div\u003e\n    \u003c/div\u003e\n  \u003c/div\u003e\n\u003c/div\u003e\n\n\u003c!-- ROW 2: TERMINAL + PAINEL --\u003e\n\u003cdiv class=\"row\"\u003e\n  \u003cdiv class=\"col\"\u003e\n    \u003cdiv class=\"w\" style=\"min-height:360px;\"\u003e\n      \u003cdiv class=\"wt\"\u003e\u003cspan\u003e\u0026#x1F4BB; Command Prompt - kubectl\u003c/span\u003e\u003cdiv class=\"btns\"\u003e\u003cspan\u003e_\u003c/span\u003e\u003cspan\u003e\u0026#x25A1;\u003c/span\u003e\u003cspan\u003e\u0026#x2715;\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\n      \u003cdiv class=\"term\"\u003e\n        \u003cspan class=\"p\"\u003eC:\\\u0026gt; \u003c/span\u003e\u003cspan class=\"c\"\u003ekubectl get pods -A\u003c/span\u003e\n        \u003cspan id=\"pod-output\" class=\"o\"\u003eCarregando...\u003c/span\u003e\n        \u003cspan class=\"o\"\u003e\u003c/span\u003e\n        \u003cspan class=\"p\"\u003eC:\\\u0026gt; \u003c/span\u003e\u003cspan class=\"c\"\u003ekubectl get nodes\u003c/span\u003e\n        \u003cspan id=\"node-output\" class=\"o\"\u003eCarregando...\u003c/span\u003e\n        \u003cspan class=\"o\"\u003e\u003c/span\u003e\n        \u003cspan class=\"p\"\u003eC:\\\u0026gt; \u003cspan class=\"blink\"\u003e_\u003c/span\u003e\u003c/span\u003e\n      \u003c/div\u003e\n    \u003c/div\u003e\n  \u003c/div\u003e\n  \u003cdiv class=\"col\"\u003e\n    \u003cdiv class=\"w\"\u003e\n      \u003cdiv class=\"wt\"\u003e\u003cspan\u003e\u0026#x2699;\u0026#xFE0F; Painel de Controle\u003c/span\u003e\u003cdiv class=\"btns\"\u003e\u003cspan\u003e_\u003c/span\u003e\u003cspan\u003e\u0026#x25A1;\u003c/span\u003e\u003cspan\u003e\u0026#x2715;\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\n      \u003cdiv class=\"wb\" style=\"padding:8px 10px;\"\u003e\n        \u003cdiv class=\"tg\"\u003e\n          \u003cspan\u003eKubernetes\u003c/span\u003e\u003cspan\u003eDocker\u003c/span\u003e\u003cspan\u003eKind\u003c/span\u003e\u003cspan\u003eHelm\u003c/span\u003e\u003cspan\u003enginx\u003c/span\u003e\n          \u003cspan\u003ePostgreSQL\u003c/span\u003e\u003cspan\u003eArgoCD\u003c/span\u003e\u003cspan\u003ePrometheus\u003c/span\u003e\u003cspan\u003eGrafana\u003c/span\u003e\n          \u003cspan\u003eLoki\u003c/span\u003e\u003cspan\u003ecert-manager\u003c/span\u003e\u003cspan\u003eCloudflare\u003c/span\u003e\n        \u003c/div\u003e\n      \u003c/div\u003e\n    \u003c/div\u003e\n    \n    \u003cdiv class=\"w\" style=\"margin-top:12px;\"\u003e\n      \u003cdiv class=\"wt\"\u003e\u003cspan\u003e\u0026#x1F5A5;\u0026#xFE0F; Gerenciador de Dispositivos\u003c/span\u003e\u003cdiv class=\"btns\"\u003e\u003cspan\u003e_\u003c/span\u003e\u003cspan\u003e\u0026#x25A1;\u003c/span\u003e\u003cspan\u003e\u0026#x2715;\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\n      \u003cdiv class=\"wb\" style=\"padding:8px 10px;font-size:11px\"\u003e\n        \u003cdiv style=\"font-weight:700;font-size:13px;margin-bottom:4px;color:#000080;\"\u003e\u0026#x1F4E6; lab-sre-denoso \u0026middot; Kind v1.27.3\u003c/div\u003e\n        \u003cdiv style=\"display:flex;gap:4px;margin-bottom:4px;flex-wrap:wrap;\"\u003e\n          \u003cspan class=\"mbox\"\u003e\u003cspan class=\"n\" id=\"dev-pods\"\u003e18\u003c/span\u003e\u003cspan class=\"l\"\u003ePods\u003c/span\u003e\u003c/span\u003e\n          \u003cspan class=\"mbox\"\u003e\u003cspan class=\"n\" id=\"dev-svcs\"\u003e-\u003c/span\u003e\u003cspan class=\"l\"\u003eSvcs\u003c/span\u003e\u003c/span\u003e\n          \u003cspan class=\"mbox\"\u003e\u003cspan class=\"n\" id=\"dev-ns\"\u003e-\u003c/span\u003e\u003cspan class=\"l\"\u003eNS\u003c/span\u003e\u003c/span\u003e\n          \u003cspan class=\"mbox\"\u003e\u003cspan class=\"n\" id=\"dev-nodes\"\u003e1\u003c/span\u003e\u003cspan class=\"l\"\u003eNo\u003c/span\u003e\u003c/span\u003e\n          \u003cspan class=\"mbox\"\u003e\u003cspan class=\"n\"\u003e99%\u003c/span\u003e\u003cspan class=\"l\"\u003eUptime\u003c/span\u003e\u003c/span\u003e\n        \u003c/div\u003e\n        \u003cdiv style=\"border-top:1px solid #808080;border-bottom:1px solid #fff;padding-top:3px;margin-bottom:3px;\"\u003e\u003c/div\u003e\n        \u003cdiv style=\"font-size:11px;line-height:1.6;\"\u003e\n          \u003cdiv\u003e\u0026#x25B6; \u003cstrong\u003eCluster:\u003c/strong\u003e Kind (WSL2) \u0026middot; K8s v1.27.3\u003c/div\u003e\n          \u003cdiv\u003e\u0026#x25B6; \u003cstrong\u003eIngress:\u003c/strong\u003e nginx-controller \u0026middot; NodePort 30080\u003c/div\u003e\n          \u003cdiv\u003e\u0026#x25B6; \u003cstrong\u003eGitOps:\u003c/strong\u003e ArgoCD v2.12.3 \u0026middot; auto-sync\u003c/div\u003e\n          \u003cdiv\u003e\u0026#x25B6; \u003cstrong\u003eCert:\u003c/strong\u003e cert-manager \u0026middot; Let\u0026rsquo;s Encrypt\u003c/div\u003e\n          \u003cdiv\u003e\u0026#x25B6; \u003cstrong\u003eDB:\u003c/strong\u003e PostgreSQL 15 \u0026middot; StatefulSet + PVC\u003c/div\u003e\n          \u003cdiv\u003e\u0026#x25B6; \u003cstrong\u003eMonitor:\u003c/strong\u003e Prometheus + Grafana + Loki\u003c/div\u003e\n          \u003cdiv\u003e\u0026#x25B6; \u003cstrong\u003ePolicy:\u003c/strong\u003e Kyverno \u0026middot; NetworkPolicies \u0026middot; HPA\u003c/div\u003e\n          \u003cdiv\u003e\u0026#x25B6; \u003cstrong\u003eTunnel:\u003c/strong\u003e Cloudflare \u0026middot; TLS edge\u003c/div\u003e\n          \u003cdiv\u003e\u0026#x25B6; \u003cstrong\u003eAPI:\u003c/strong\u003e kubectl proxy \u0026middot; /k8s/ endpoint\u003c/div\u003e\n        \u003c/div\u003e\n      \u003c/div\u003e\n    \u003c/div\u003e\n  \u003c/div\u003e\n\u003c/div\u003e\n\n\u003c!-- ROW 3: PAINT / DASHBOARD FULL WIDTH --\u003e\n\u003cdiv class=\"row\"\u003e\n  \u003cdiv class=\"col-2\"\u003e\n    \u003cdiv class=\"w\" style=\"min-height:440px;\"\u003e\n      \u003cdiv class=\"wt\"\u003e\u003cspan\u003e\u0026#x1F3A8; paint.exe - grafana-dashboard.bmp\u003c/span\u003e\u003cdiv class=\"btns\"\u003e\u003cspan\u003e_\u003c/span\u003e\u003cspan\u003e\u0026#x25A1;\u003c/span\u003e\u003cspan\u003e\u0026#x2715;\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\n      \u003cdiv class=\"paint-menu\"\u003e\n        \u003cspan\u003eArquivo\u003c/span\u003e\u003cspan\u003eEditar\u003c/span\u003e\u003cspan\u003eExibir\u003c/span\u003e\u003cspan\u003eImagem\u003c/span\u003e\u003cspan\u003eOp\u0026ccedil;\u0026otilde;es\u003c/span\u003e\u003cspan\u003eAjuda\u003c/span\u003e\n      \u003c/div\u003e\n      \u003cdiv style=\"display:flex;flex:1;border:2px solid;border-color:#808080 #fff #fff #808080;margin:4px 4px 2px 4px;background:#c0c0c0;\"\u003e\n        \u003cdiv class=\"paint-toolbar\"\u003e\n          \u003cspan\u003e\u0026#x270F;\u0026#xFE0F;\u003c/span\u003e\u003cspan\u003e\u0026#x1F58C;\u0026#xFE0F;\u003c/span\u003e\u003cspan\u003e\u0026#x270D;\u0026#xFE0F;\u003c/span\u003e\u003cspan\u003e\u0026#x1F58B;\u0026#xFE0F;\u003c/span\u003e\u003cspan\u003e\u0026#x1FAA3;\u003c/span\u003e\u003cspan\u003e\u0026#x1F4DD;\u003c/span\u003e\n          \u003cspan\u003e\u0026#x1F50D;\u003c/span\u003e\u003cspan\u003e\u0026#x1F3A8;\u003c/span\u003e\u003cspan\u003e\u0026#x2571;\u003c/span\u003e\u003cspan\u003e\u0026#x25C7;\u003c/span\u003e\u003cspan\u003e\u0026#x25EF;\u003c/span\u003e\u003cspan\u003e\u0026#x25AD;\u003c/span\u003e\n          \u003cspan\u003e\u0026#x2B1F;\u003c/span\u003e\n        \u003c/div\u003e\n        \u003cdiv class=\"paint-canvas\"\u003e\n          \u003cdiv style=\"width:100%;height:380px;overflow:hidden;position:relative;\"\u003e\n            \u003ciframe src=\"https://grafana.denisdeoliveira.com.br/d/cluster-sre/cluster-sre?orgId=1\u0026amp;kiosk=tv\" width=\"100%\" height=\"455\" frameborder=\"0\" style=\"display:block;position:absolute;top:-75px;left:0;width:100%;height:125%;border:none;\"\u003e\u003c/iframe\u003e\n          \u003c/div\u003e\n        \u003c/div\u003e\n      \u003c/div\u003e\n      \u003cdiv style=\"background:#c0c0c0;border-top:1px solid #fff;padding:3px 6px;display:flex;align-items:center;gap:3px;flex-shrink:0;\"\u003e\n        \u003cdiv style=\"border:1px solid;border-color:#fff #808080 #808080 #fff;display:flex;padding:2px;background:#fff;\"\u003e\n          \u003cdiv style=\"width:16px;height:16px;background:#000;border:1px solid #808080;\"\u003e\u003c/div\u003e\n        \u003c/div\u003e\n        \u003cdiv style=\"display:flex;flex-wrap:wrap;gap:1px;\"\u003e\n          \u003cspan class=\"color-box\" style=\"background:#000;\"\u003e\u003c/span\u003e\n          \u003cspan class=\"color-box\" style=\"background:#fff;\"\u003e\u003c/span\u003e\n          \u003cspan class=\"color-box\" style=\"background:#808080;\"\u003e\u003c/span\u003e\n          \u003cspan class=\"color-box\" style=\"background:#800000;\"\u003e\u003c/span\u003e\n          \u003cspan class=\"color-box\" style=\"background:#008000;\"\u003e\u003c/span\u003e\n          \u003cspan class=\"color-box\" style=\"background:#808000;\"\u003e\u003c/span\u003e\n          \u003cspan class=\"color-box\" style=\"background:#000080;\"\u003e\u003c/span\u003e\n          \u003cspan class=\"color-box\" style=\"background:#800080;\"\u003e\u003c/span\u003e\n          \u003cspan class=\"color-box\" style=\"background:#008080;\"\u003e\u003c/span\u003e\n          \u003cspan class=\"color-box\" style=\"background:#c0c0c0;\"\u003e\u003c/span\u003e\n          \u003cspan class=\"color-box\" style=\"background:#ff0000;\"\u003e\u003c/span\u003e\n          \u003cspan class=\"color-box\" style=\"background:#00ff00;\"\u003e\u003c/span\u003e\n          \u003cspan class=\"color-box\" style=\"background:#ffff00;\"\u003e\u003c/span\u003e\n          \u003cspan class=\"color-box\" style=\"background:#0000ff;\"\u003e\u003c/span\u003e\n          \u003cspan class=\"color-box\" style=\"background:#ff00ff;\"\u003e\u003c/span\u003e\n          \u003cspan class=\"color-box\" style=\"background:#00ffff;\"\u003e\u003c/span\u003e\n        \u003c/div\u003e\n      \u003c/div\u003e\n      \u003cdiv class=\"sb\"\u003e\u003cspan\u003e\u0026#x1F5BC;\u0026#xFE0F; 640x480 \u0026middot; 256 cores\u003c/span\u003e\u003cspan\u003e\u0026#x1F50C; Para Ajuda, pressione F1\u003c/span\u003e\u003c/div\u003e\n    \u003c/div\u003e\n  \u003c/div\u003e\n\u003c/div\u003e\n\n\u003c/div\u003e\u003c!-- desktop --\u003e\n\n\u003c!-- TASKBAR --\u003e\n\u003cdiv class=\"taskbar\"\u003e\n  \u003cbutton class=\"start\" onclick='alert(\"Windows 95 + Kubernetes = Win95Ops\")'\u003e\u003cspan\u003e\u0026#x1FA9F;\u003c/span\u003e Iniciar\u003c/button\u003e\n  \u003cdiv class=\"task\"\u003e\u0026#x1F4C4; Sobre\u003c/div\u003e\n  \u003cdiv class=\"task\"\u003e\u0026#x1F4BB; Prompt\u003c/div\u003e\n  \u003cdiv class=\"task\"\u003e\u0026#x1F3A8; Paint\u003c/div\u003e\n  \u003cdiv class=\"time\" id=\"clock\"\u003e\u003c/div\u003e\n\u003c/div\u003e\n\n\u003cscript\u003e\nfunction updateClock(){\n  var d=new Date();\n  document.getElementById(\"clock\").textContent=\n    d.getHours().toString().padStart(2,\"0\")+\":\"+\n    d.getMinutes().toString().padStart(2,\"0\");\n}\nupdateClock();\nsetInterval(updateClock,10000);\n\n// Click on clock shows viewport info\ndocument.getElementById(\"clock\").onclick=function(){\n  alert(\"VIEW \"+window.innerWidth+\"x\"+window.innerHeight);\n};\n\n// Live kubectl data\nasync function loadKubeData(){\n  try{\n    var r=await fetch(\"/k8s/api/v1/pods?limit=40\");\n    var d=await r.json();\n    document.getElementById(\"pod-output\").textContent=\n      d.items.map(function(x){\n        var ns=(x.metadata.namespace+\"       \").slice(0,12);\n        var nm=(x.metadata.name+\"                       \").slice(0,28);\n        var st=x.status.phase==\"Running\"?\"1/1\":\"0/1\";\n        return ns+\" \"+nm+\" \"+st+\"  \"+x.status.phase;\n      }).join(\"\\n\");\n  }catch(e){\n    document.getElementById(\"pod-output\").textContent=\"API: \"+e.message;\n  }\n  try{\n    var r2=await fetch(\"/k8s/api/v1/nodes\");\n    var d2=await r2.json();\n    document.getElementById(\"node-output\").textContent=\n      d2.items.map(function(n){\n        var c=n.status.conditions.find(function(x){return x.type==\"Ready\";});\n        return (n.metadata.name+\"          \").slice(0,28)+\" \"+\n               (c\u0026\u0026c.status==\"True\"?\"Ready\":\"NotReady\");\n      }).join(\"\\n\");\n  }catch(e){\n    document.getElementById(\"node-output\").textContent=\"API: \"+e.message;\n  }\n}\nloadKubeData();\nsetInterval(loadKubeData,15000);\n\u003c/script\u003e\n\n\u003cscript\u003e\nwindow.addEventListener(\"resize\",function(){\n  var w=document.getElementById(\"desktop-wrap\"),s=Math.min(window.innerWidth/1100,1);\n  if(w){w.style.transform=\"scale(\"+s+\")\";w.style.margin=\"0\";}\n  document.body.style.overflow=s\u003c1?\"hidden\":\"auto\";\n});\n\u003c/script\u003e\n\u003cscript\u003e\nasync function updateDevices(){\n  try{\n    var r=await fetch(\"/k8s/api/v1/pods?limit=100\");\n    var d=await r.json();\n    var total=0;\n    d.items.forEach(function(p){total++;});\n    var el=document.getElementById(\"dev-pods\");\n    if(el)el.textContent=total;\n    \n    var r2=await fetch(\"/k8s/api/v1/services?limit=100\");\n    var d2=await r2.json();\n    var el2=document.getElementById(\"dev-svcs\");\n    if(el2)el2.textContent=d2.items.length;\n    \n    var r3=await fetch(\"/k8s/api/v1/namespaces?limit=50\");\n    var d3=await r3.json();\n    var el3=document.getElementById(\"dev-ns\");\n    if(el3)el3.textContent=d3.items.length;\n    \n    var r4=await fetch(\"/k8s/api/v1/nodes\");\n    var d4=await r4.json();\n    var el4=document.getElementById(\"dev-nodes\");\n    if(el4)el4.textContent=d4.items.length;\n  }catch(e){}\n}\nupdateDevices();\n\u003c/script\u003e\n\u003c/body\u003e\n\u003c/html\u003e\n"},"kind":"ConfigMap","metadata":{"annotations":{},"creationTimestamp":null,"name":"nginx-html-config","namespace":"default"}}
  
