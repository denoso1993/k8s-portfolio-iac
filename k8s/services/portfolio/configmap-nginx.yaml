    function ff(el){while(el&&!el.classList.contains("w"))el=el.parentNode;if(el){z++;el.style.zIndex=z;}}
    function oo(id){var w=document.getElementById(id);if(!w)return;ff(w);if(window.innerWidth<=1200){["x","t","d","l","a"].forEach(function(i){if(i!=id){var ow=document.getElementById(i);if(ow&&ow.classList.contains("o")){ow.classList.remove("o");ow.style.cssText+=";display:none!important;";updtask(i,false);}}});}var tb=document.getElementById("tb-"+id);if(tb){w.classList.add("o");w.style.cssText+=";display:flex!important;";tb.classList.add("act");return;}w.classList.add("o");w.style.cssText+=";display:flex!important;";w.style.height="";updtask(id,true);}
    function xx(id){try{var w=document.getElementById(id);if(!w)return;w.classList.remove("o");w.style.cssText+=";display:none!important;";updtask(id,false);}catch(e){}}
    function updtask(id,show){var tb=document.getElementById("taskitems");var ex=document.getElementById("tb-"+id);if(ex&&!show){ex.remove();return;}if(ex)return;var w=document.getElementById(id);if(!w)return;var nm=w.getAttribute("data-win")||id;var btn=document.createElement("div");btn.className="tsk act";btn.id="tb-"+id;btn.textContent=nm;btn.onclick=function(){var w2=document.getElementById(id);if(!w2)return;if(w2.classList.contains("o")){w2.style.display="none";w2.classList.remove("o");this.classList.remove("act");}else{w2.classList.add("o");w2.style.display="flex";ff(w2);this.classList.add("act");}};tb.appendChild(btn);if(!w.classList.contains("o")){btn.classList.remove("act");}}
    document.addEventListener("mousedown",function(e){var wt=e.target.closest(".wt");if(!wt||e.target.closest(".btns"))return;var w=wt.parentNode;ff(w);var r=w.getBoundingClientRect();var dx=e.clientX-r.left,dy=e.clientY-r.top;function m(me){w.style.left=Math.max(0,me.clientX-dx)+"px";w.style.top=Math.max(0,me.clientY-dy)+"px";}function up(){document.removeEventListener("mousemove",m);document.removeEventListener("mouseup",up);}document.addEventListener("mousemove",m);document.addEventListener("mouseup",up);});
