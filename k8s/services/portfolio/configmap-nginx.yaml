  index.html: "<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"UTF-8\">\n<script>document.write('<style
    id=\"scale-style\">#desktop-wrap{transform:scale('+(Math.min(window.innerWidth/1100,1))+');width:1100px;transform-origin:top
    left;margin:0;}</style>');</script>\n\n<meta http-equiv=\"X-Frame-Options\" content=\"DENY\">\n<meta
    http-equiv=\"X-Content-Type-Options\" content=\"nosniff\">\n<meta http-equiv=\"Referrer-Policy\"
    content=\"no-referrer-when-downgrade\">\n<meta http-equiv=\"Content-Security-Policy\"
    content=\"default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self'
    'unsafe-inline'; img-src 'self' https: data:; frame-src https://grafana.denisdeoliveira.com.br;
    connect-src 'self' /k8s/; font-src 'self'; form-action 'self';\">\n<title>Denis
    Oliveira Ramos</title>\n<link rel=\"icon\" type=\"image/png\" href=\"data:image/png;base64,\">\n<style>\n*{margin:0;padding:0;box-sizing:border-box}\nhtml,body{width:100%;height:100%}\nbody{\n
    \ background:#008080;\n  font-family:'MS Sans Serif','Courier New',monospace;\n
    \ font-size:13px;\n  overflow-y:auto;\n  overflow-x:hidden;\n  padding:16px 16px
    48px;\n  min-height:100vh;\n}\n\n/* Desktop flex container */\n.desktop{\n  max-width:1100px;\n
    \ margin:0 auto;\n  display:flex;\n  flex-direction:column;\n  gap:12px;\n}\n\n/*
    Row for horizontal grouping */\n.row{\n  display:flex;\n  flex-wrap:wrap;\n  gap:12px;\n}\n\n/*
    Column variants */\n.col{flex:1;min-width:280px;display:flex;flex-direction:column;}\n.col-2{flex:2;min-width:350px;display:flex;flex-direction:column;}\n.col-3{flex:3;min-width:300px;display:flex;flex-direction:column;}\n\n/*
    Win95 window */\n.w{\n  position:relative;\n  background:#c0c0c0;\n  border:2px
    solid;\n  border-color:#fff #808080 #808080 #fff;\n  box-shadow:2px 2px 0 0 #404040;\n
    \ display:flex;\n  flex-direction:column;\n  width:100%;\n  min-height:100px;\n}\n\n/*
    Title bar */\n.wt{\n  background:linear-gradient(90deg,#000080,#1084d0);\n  color:#fff;\n
    \ font-weight:700;\n  font-size:14px;\n  padding:5px 8px 5px 10px;\n  display:flex;\n
    \ align-items:center;\n  justify-content:space-between;\n  min-height:28px;\n
    \ cursor:default;\n  user-select:none;\n  flex-shrink:0;\n}\n.wt .btns{display:flex;gap:2px;flex-shrink:0}\n.wt
    .btns span{\n  width:18px;height:16px;background:#c0c0c0;\n  border:1px solid;border-color:#fff
    #808080 #808080 #fff;\n  display:flex;align-items:center;justify-content:center;\n
    \ font-size:11px;color:#000;\n}\n\n/* Window body */\n.wb{padding:8px 12px;flex:1;font-size:12px;line-height:1.3;color:#222;overflow:auto;}\n\n/*
    Status bar */\n.sb{\n  background:#c0c0c0;border-top:1px solid #fff;\n  padding:2px
    8px;display:flex;justify-content:space-between;\n  font-size:11px;color:#444;flex-shrink:0;\n}\n\n/*
    Terminal */\n.term{\n  background:#000;color:#0f0;font-family:'Courier New',monospace;font-size:12px;\n
    \ padding:8px 10px;\n  border:2px solid;border-color:#808080 #fff #fff #808080;\n
    \ flex:1;overflow-y:auto;overflow-x:auto;\n}\n.term .p{color:#0f0}.term .c{color:#fff}.term
    .o{\n  color:#0f0;display:block;padding-left:8px;white-space:pre-wrap;word-break:break-all;font-size:12px;line-height:1.4;\n}\n\n/*
    Blink cursor */\n.blink{animation:blink 1s step-end infinite}\n@keyframes blink{50%{opacity:0}}\n\n/*
    Tag cloud */\n.tg{display:flex;flex-wrap:wrap;gap:3px;align-content:flex-start;}\n.tg
    span{\n  background:#fff;border:1px solid;border-color:#808080 #fff #fff #808080;\n
    \ padding:3px 8px;font-size:11px;color:#222;\n}\n\n/* Metric box */\n.mbox{\n
    \ background:#fff;border:1px solid;border-color:#808080 #fff #fff #808080;\n  padding:3px
    8px;text-align:center;display:inline-block;margin:1px;min-width:42px;\n}\n.mbox
    .n{font-size:18px;font-weight:700;color:#000;display:block;}\n.mbox .l{font-size:9px;color:#555;}\n\n/*
    Win95 button */\n.w95-btn{\n  background:#c0c0c0;border:1px solid;border-color:#fff
    #808080 #808080 #fff;\n  padding:3px 10px;font-family:inherit;font-size:11px;\n
    \ display:inline-flex;align-items:center;gap:4px;\n  text-decoration:none;color:#222;margin:1px;\n}\n\n/*
    Taskbar */\n.taskbar{\n  position:fixed;bottom:0;left:0;right:0;z-index:999;\n
    \ background:#c0c0c0;border-top:2px solid #fff;\n  padding:3px 6px;display:flex;align-items:center;gap:4px;height:30px;\n}\n.taskbar
    .start{\n  background:#c0c0c0;border:1px solid;border-color:#fff #808080 #808080
    #fff;\n  padding:2px 10px;font-weight:700;font-size:13px;font-family:inherit;\n
    \ display:flex;align-items:center;gap:4px;cursor:pointer;height:22px;\n}\n.taskbar
    .task{\n  background:#c0c0c0;border:1px solid;border-color:#808080 #fff #fff #808080;\n
    \ padding:2px 12px;font-size:11px;display:flex;align-items:center;\n}\n.taskbar
    .time{\n  margin-left:auto;border:1px solid;border-color:#808080 #fff #fff #808080;\n
    \ padding:2px 8px;font-size:11px;background:#c0c0c0;cursor:pointer;\n}\n\n/* PAINT
    toolbar */\n.paint-toolbar{\n  background:#c0c0c0;border:1px solid;border-color:#fff
    #808080 #808080 #fff;\n  padding:3px;display:grid;grid-template-columns:1fr 1fr;gap:2px;\n
    \ width:54px;flex-shrink:0;align-content:start;\n}\n.paint-toolbar span{\n  width:23px;height:23px;background:#c0c0c0;\n
    \ border:1px solid;border-color:#fff #808080 #808080 #fff;\n  display:flex;align-items:center;justify-content:center;\n}\n.paint-menu{padding:2px
    6px;display:flex;gap:8px;font-size:11px;flex-shrink:0;}\n.paint-menu span{padding:1px
    8px;}\n.paint-canvas{flex:1;margin:3px;background:#fff;border:1px solid;border-color:#808080
    #fff #fff #808080;overflow:hidden;}\n.color-box{width:14px;height:14px;border:1px
    solid #808080;}\n\n/* Profile photo */\n.profile-photo{\n  width:80px;height:80px;object-fit:cover;\n
    \ border:2px inset #808080;display:block;\n}\n\n/* Green dot */\n.dot-g{width:7px;height:7px;background:#0a0;border:1px
    solid #080;display:inline-block;margin-right:3px;vertical-align:middle;}\n\n/*
    Links */\na{color:#000080;}\n\n#desktop-wrap{width:1100px;margin:0 auto;transform-origin:top
    left;}\n\n</style>\n</head>\n<body>\n\n<div id=\"desktop-wrap\"><div class=\"desktop\">\n\n<!--
    ROW 1: SOBRE + LINKS -->\n<div class=\"row\">\n  <div class=\"col-3\">\n    <div
    class=\"w\">\n      <div class=\"wt\"><span>&#x1F5AA; Sobre - Denis Oliveira Ramos</span><div
    class=\"btns\"><span>_</span><span>&#x25A1;</span><span>&#x2715;</span></div></div>\n
    \     <div class=\"wb\" style=\"padding:12px 16px;font-size:15px;line-height:1.5\">\n
    \       <table width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" style=\"border:none;\">\n
    \         <tr>\n            <td valign=\"top\" width=\"95\" style=\"padding-right:18px;\">\n
    \             <img src=\"https://i.imgur.com/lJoDtkK.jpeg\" class=\"profile-photo\"
    alt=\"Denis\">\n            </td>\n            <td valign=\"top\">\n              <div
    style=\"font-size:20px;font-weight:700;margin-bottom:1px;\">Denis Oliveira Ramos</div>\n
    \             <div style=\"font-size:13px;color:#444;margin-bottom:2px;\">Senior
    Cloud &amp; Infrastructure Engineer</div>\n              <div style=\"font-size:12px;color:#666;margin-bottom:6px;\">\n
    \               &#x1F4CD; Barueri, SP &middot; &#x1F310; Ingl&ecirc;s C1/C2 &middot;
    &#x1F4C5; 8+ anos de experiencia\n              </div>\n            </td>\n          </tr>\n
    \       </table>\n        <div style=\"font-size:14px;line-height:1.6;\">\n          <p
    style=\"margin-bottom:4px;\"><strong>Sobre mim</strong></p>\n          <p style=\"margin-bottom:4px;\">Profissional
    de Infraestrutura Cloud com forte especializa&ccedil;&atilde;o em ambientes <strong>Linux</strong>,
    <strong>Bancos de Dados</strong> e ecossistemas <strong>Cloud Native</strong>.
    Atualmente dispon&iacute;vel para novos desafios, com experi&ecirc;ncia em <strong>Cloud
    Infrastructure</strong>, <strong>SRE</strong> e engenharia de plataforma.</p>\n
    \         <p style=\"margin-bottom:4px;\">Minha abordagem &eacute; pr&aacute;tica
    e anal&iacute;tica, focada em entregar solu&ccedil;&otilde;es escal&aacute;veis
    e automatizadas. Este portf&oacute;lio &eacute; a <strong>prova de conceito</strong>
    &mdash; uma aplica&ccedil;&atilde;o hospedada em cluster Kubernetes 100% declarativo,
    mantido via <strong>IaC</strong> com <strong>Terraform</strong> e <strong>Helm</strong>,
    com observabilidade completa via <strong>Prometheus + Grafana + Loki</strong>
    e GitOps com <strong>ArgoCD</strong>. <strong>Tudo rodando no WSL2.</strong></p>\n
    \         <p style=\"margin-bottom:0;\"><strong>Principais compet&ecirc;ncias:</strong>
    Kubernetes, Docker, Terraform, Helm, ArgoCD, GitOps, Prometheus, Grafana, Linux
    (RHEL/Oracle), Windows Server, PostgreSQL, SQL Server, PowerShell, Cloudflare,
    NetworkPolicies, Disaster Recovery, RTO/RPO/MTTR.</p>\n        </div>\n      </div>\n
    \     <div class=\"sb\"><span><span class=\"dot-g\"></span> Online &middot; Kind
    &middot; Cloudflare &middot; WSL2</span><span>15/15 pods &middot; &#x1F4E1; Live</span></div>\n
    \   </div>\n  </div>\n  <div class=\"col\">\n    <div class=\"w\">\n      <div
    class=\"wt\"><span>&#x1F4C4; Links</span><div class=\"btns\"><span>_</span><span>&#x25A1;</span><span>&#x2715;</span></div></div>\n
    \     <div class=\"wb\" style=\"padding:6px 10px\">\n        <div style=\"font-weight:700;margin-bottom:2px;\">Curr&iacute;culos</div>\n
    \       <a href=\"https://drive.google.com/drive/folders/1HsHI4QwXOS5NkfCRBcZzUDqrOpnHI1OV\"
    target=\"_blank\" class=\"w95-btn\">&#x1F4C4; Curriculo PT-BR / EN-US</a>\n        <div
    style=\"font-weight:700;margin:4px 0 2px;\">Links</div>\n        <a href=\"https://linkedin.com/in/denis93\"
    target=\"_blank\" class=\"w95-btn\">&#x1F4BC; LinkedIn</a>\n        <a href=\"https://github.com/denoso1993/k8s-portfolio-iac\"
    target=\"_blank\" class=\"w95-btn\">&#x1F419; Cluster K8s Github</a>\n        <a
    href=\"mailto:denis_oliveira@rocketmail.com\" class=\"w95-btn\">&#x1F4E7; Email</a>\n
    \       <a href=\"https://drive.google.com/drive/folders/1FcYD8bK9-_ELUoMHFNZzyWU-5mOJTy3H\"
    target=\"_blank\" class=\"w95-btn\">&#x1F4C1; Projetos + Scripts</a>\n        <a
    href=\"https://drive.google.com/drive/folders/1k_4mO-j4WEoaIGngR9cGLX1WpVSKC-AD\"
    target=\"_blank\" class=\"w95-btn\">&#x1F4DC; Certificados</a>\n        <a href=\"https://drive.google.com/drive/folders/1yI8Hf9Ku_jncA5YtFkkkc0zN3oq1j5Xv\"
    target=\"_blank\" class=\"w95-btn\">&#x1F310; Cert. English Proficiency</a>\n
    \     </div>\n    </div>\n  </div>\n</div>\n\n<!-- ROW 2: TERMINAL + PAINEL -->\n<div
    class=\"row\">\n  <div class=\"col\">\n    <div class=\"w\" style=\"min-height:360px;\">\n
    \     <div class=\"wt\"><span>&#x1F4BB; Command Prompt - kubectl</span><div class=\"btns\"><span>_</span><span>&#x25A1;</span><span>&#x2715;</span></div></div>\n
    \     <div class=\"term\">\n        <span class=\"p\">C:\\&gt; </span><span class=\"c\">kubectl
    get pods -A</span>\n        <span id=\"pod-output\" class=\"o\">Carregando...</span>\n
    \       <span class=\"o\"></span>\n        <span class=\"p\">C:\\&gt; </span><span
    class=\"c\">kubectl get nodes</span>\n        <span id=\"node-output\" class=\"o\">Carregando...</span>\n
    \       <span class=\"o\"></span>\n        <span class=\"p\">C:\\&gt; <span class=\"blink\">_</span></span>\n
    \     </div>\n    </div>\n  </div>\n  <div class=\"col\">\n    <div class=\"w\">\n
    \     <div class=\"wt\"><span>&#x2699;&#xFE0F; Painel de Controle</span><div class=\"btns\"><span>_</span><span>&#x25A1;</span><span>&#x2715;</span></div></div>\n
    \     <div class=\"wb\" style=\"padding:8px 10px;\">\n        <div class=\"tg\">\n
    \         <span>Kubernetes</span><span>Docker</span><span>Kind</span><span>Helm</span><span>nginx</span>\n
    \         <span>PostgreSQL</span><span>ArgoCD</span><span>Prometheus</span><span>Grafana</span>\n
    \         <span>Loki</span><span>cert-manager</span><span>Cloudflare</span>\n
    \       </div>\n      </div>\n    </div>\n    \n    <div class=\"w\" style=\"margin-top:12px;\">\n
    \     <div class=\"wt\"><span>&#x1F5A5;&#xFE0F; Gerenciador de Dispositivos</span><div
    class=\"btns\"><span>_</span><span>&#x25A1;</span><span>&#x2715;</span></div></div>\n
    \     <div class=\"wb\" style=\"padding:8px 10px;font-size:11px\">\n        <div
    style=\"font-weight:700;font-size:13px;margin-bottom:4px;color:#000080;\">&#x1F4E6;
    lab-sre-denoso &middot; Kind v1.27.3</div>\n        <div style=\"display:flex;gap:4px;margin-bottom:4px;flex-wrap:wrap;\">\n
    \         <span class=\"mbox\"><span class=\"n\" id=\"dev-pods\">18</span><span
    class=\"l\">Pods</span></span>\n          <span class=\"mbox\"><span class=\"n\"
    id=\"dev-svcs\">-</span><span class=\"l\">Svcs</span></span>\n          <span
    class=\"mbox\"><span class=\"n\" id=\"dev-ns\">-</span><span class=\"l\">NS</span></span>\n
    \         <span class=\"mbox\"><span class=\"n\" id=\"dev-nodes\">1</span><span
    class=\"l\">No</span></span>\n          <span class=\"mbox\"><span class=\"n\">99%</span><span
    class=\"l\">Uptime</span></span>\n        </div>\n        <div style=\"border-top:1px
    solid #808080;border-bottom:1px solid #fff;padding-top:3px;margin-bottom:3px;\"></div>\n
    \       <div style=\"font-size:11px;line-height:1.6;\">\n          <div>&#x25B6;
    <strong>Cluster:</strong> Kind (WSL2) &middot; K8s v1.27.3</div>\n          <div>&#x25B6;
    <strong>Ingress:</strong> nginx-controller &middot; NodePort 30080</div>\n          <div>&#x25B6;
    <strong>GitOps:</strong> ArgoCD v2.12.3 &middot; auto-sync</div>\n          <div>&#x25B6;
    <strong>Cert:</strong> cert-manager &middot; Let&rsquo;s Encrypt</div>\n          <div>&#x25B6;
    <strong>DB:</strong> PostgreSQL 15 &middot; StatefulSet + PVC</div>\n          <div>&#x25B6;
    <strong>Monitor:</strong> Prometheus + Grafana + Loki</div>\n          <div>&#x25B6;
    <strong>Policy:</strong> Kyverno &middot; NetworkPolicies &middot; HPA</div>\n
    \         <div>&#x25B6; <strong>Tunnel:</strong> Cloudflare &middot; TLS edge</div>\n
    \         <div>&#x25B6; <strong>API:</strong> kubectl proxy &middot; /k8s/ endpoint</div>\n
    \       </div>\n      </div>\n    </div>\n  </div>\n</div>\n\n<!-- ROW 3: PAINT
    / DASHBOARD FULL WIDTH -->\n<div class=\"row\">\n  <div class=\"col-2\">\n    <div
    class=\"w\" style=\"min-height:440px;\">\n      <div class=\"wt\"><span>&#x1F3A8;
    paint.exe - grafana-dashboard.bmp</span><div class=\"btns\"><span>_</span><span>&#x25A1;</span><span>&#x2715;</span></div></div>\n
    \     <div class=\"paint-menu\">\n        <span>Arquivo</span><span>Editar</span><span>Exibir</span><span>Imagem</span><span>Op&ccedil;&otilde;es</span><span>Ajuda</span>\n
    \     </div>\n      <div style=\"display:flex;flex:1;border:2px solid;border-color:#808080
    #fff #fff #808080;margin:4px 4px 2px 4px;background:#c0c0c0;\">\n        <div
    class=\"paint-toolbar\">\n          <span>&#x270F;&#xFE0F;</span><span>&#x1F58C;&#xFE0F;</span><span>&#x270D;&#xFE0F;</span><span>&#x1F58B;&#xFE0F;</span><span>&#x1FAA3;</span><span>&#x1F4DD;</span>\n
    \         <span>&#x1F50D;</span><span>&#x1F3A8;</span><span>&#x2571;</span><span>&#x25C7;</span><span>&#x25EF;</span><span>&#x25AD;</span>\n
    \         <span>&#x2B1F;</span>\n        </div>\n        <div class=\"paint-canvas\">\n
    \         <div style=\"width:100%;height:380px;overflow:hidden;position:relative;\">\n
    \           <iframe src=\"https://grafana.denisdeoliveira.com.br/d/cluster-sre/cluster-sre?orgId=1&amp;kiosk=tv\"
    width=\"100%\" height=\"455\" frameborder=\"0\" style=\"display:block;position:absolute;top:-75px;left:0;width:100%;height:125%;border:none;\"></iframe>\n
    \         </div>\n        </div>\n      </div>\n      <div style=\"background:#c0c0c0;border-top:1px
    solid #fff;padding:3px 6px;display:flex;align-items:center;gap:3px;flex-shrink:0;\">\n
    \       <div style=\"border:1px solid;border-color:#fff #808080 #808080 #fff;display:flex;padding:2px;background:#fff;\">\n
    \         <div style=\"width:16px;height:16px;background:#000;border:1px solid
    #808080;\"></div>\n        </div>\n        <div style=\"display:flex;flex-wrap:wrap;gap:1px;\">\n
    \         <span class=\"color-box\" style=\"background:#000;\"></span>\n          <span
    class=\"color-box\" style=\"background:#fff;\"></span>\n          <span class=\"color-box\"
    style=\"background:#808080;\"></span>\n          <span class=\"color-box\" style=\"background:#800000;\"></span>\n
    \         <span class=\"color-box\" style=\"background:#008000;\"></span>\n          <span
    class=\"color-box\" style=\"background:#808000;\"></span>\n          <span class=\"color-box\"
    style=\"background:#000080;\"></span>\n          <span class=\"color-box\" style=\"background:#800080;\"></span>\n
    \         <span class=\"color-box\" style=\"background:#008080;\"></span>\n          <span
    class=\"color-box\" style=\"background:#c0c0c0;\"></span>\n          <span class=\"color-box\"
    style=\"background:#ff0000;\"></span>\n          <span class=\"color-box\" style=\"background:#00ff00;\"></span>\n
    \         <span class=\"color-box\" style=\"background:#ffff00;\"></span>\n          <span
    class=\"color-box\" style=\"background:#0000ff;\"></span>\n          <span class=\"color-box\"
    style=\"background:#ff00ff;\"></span>\n          <span class=\"color-box\" style=\"background:#00ffff;\"></span>\n
    \       </div>\n      </div>\n      <div class=\"sb\"><span>&#x1F5BC;&#xFE0F;
    640x480 &middot; 256 cores</span><span>&#x1F50C; Para Ajuda, pressione F1</span></div>\n
    \   </div>\n  </div>\n</div>\n\n</div><!-- desktop -->\n\n<!-- TASKBAR -->\n<div
    class=\"taskbar\">\n  <button class=\"start\" onclick='alert(\"Windows 95 + Kubernetes
    = Win95Ops\")'><span>&#x1FA9F;</span> Iniciar</button>\n  <div class=\"task\">&#x1F4C4;
    Sobre</div>\n  <div class=\"task\">&#x1F4BB; Prompt</div>\n  <div class=\"task\">&#x1F3A8;
    Paint</div>\n  <div class=\"time\" id=\"clock\"></div>\n</div>\n\n<script>\nfunction
    updateClock(){\n  var d=new Date();\n  document.getElementById(\"clock\").textContent=\n
    \   d.getHours().toString().padStart(2,\"0\")+\":\"+\n    d.getMinutes().toString().padStart(2,\"0\");\n}\nupdateClock();\nsetInterval(updateClock,10000);\n\n//
    Click on clock shows viewport info\ndocument.getElementById(\"clock\").onclick=function(){\n
    \ alert(\"VIEW \"+window.innerWidth+\"x\"+window.innerHeight);\n};\n\n// Live
    kubectl data\nasync function loadKubeData(){\n  try{\n    var r=await fetch(\"/k8s/api/v1/pods?limit=40\");\n
    \   var d=await r.json();\n    document.getElementById(\"pod-output\").textContent=\n
    \     d.items.map(function(x){\n        var ns=(x.metadata.namespace+\"       \").slice(0,12);\n
    \       var nm=(x.metadata.name+\"                       \").slice(0,28);\n        var
    st=x.status.phase==\"Running\"?\"1/1\":\"0/1\";\n        return ns+\" \"+nm+\"
    \"+st+\"  \"+x.status.phase;\n      }).join(\"\\n\");\n  }catch(e){\n    document.getElementById(\"pod-output\").textContent=\"API:
    \"+e.message;\n  }\n  try{\n    var r2=await fetch(\"/k8s/api/v1/nodes\");\n    var
    d2=await r2.json();\n    document.getElementById(\"node-output\").textContent=\n
    \     d2.items.map(function(n){\n        var c=n.status.conditions.find(function(x){return
    x.type==\"Ready\";});\n        return (n.metadata.name+\"          \").slice(0,28)+\"
    \"+\n               (c&&c.status==\"True\"?\"Ready\":\"NotReady\");\n      }).join(\"\\n\");\n
    \ }catch(e){\n    document.getElementById(\"node-output\").textContent=\"API:
    \"+e.message;\n  }\n}\nloadKubeData();\nsetInterval(loadKubeData,15000);\n</script>\n\n<script>\nwindow.addEventListener(\"resize\",function(){\n
    \ var w=document.getElementById(\"desktop-wrap\"),s=Math.min(window.innerWidth/1100,1);\n
    \ if(w){w.style.transform=\"scale(\"+s+\")\";w.style.margin=\"0\";}\n  document.body.style.overflow=s<1?\"hidden\":\"auto\";\n});\n</script>\n<script>\nasync
    function updateDevices(){\n  try{\n    var r=await fetch(\"/k8s/api/v1/pods?limit=100\");\n
    \   var d=await r.json();\n    var total=0;\n    d.items.forEach(function(p){total++;});\n
    \   var el=document.getElementById(\"dev-pods\");\n    if(el)el.textContent=total;\n
    \   \n    var r2=await fetch(\"/k8s/api/v1/services?limit=100\");\n    var d2=await
