    async function k(){try{var r=await fetch("/k8s/api/v1/pods?limit=100");var d=await r.json();document.getElementById("po").textContent=d.items.map(function(x){return(x.metadata.namespace+"       ").slice(0,12)+" "+(x.metadata.name+"                       ").slice(0,28)+" "+(x.status.phase=="Running"?"1/1":"0/1")+"  "+x.status.phase;}).join("\n");}catch(e){document.getElementById("po").textContent="API: "+e.message;}try{var r2=await fetch("/k8s/api/v1/nodes");var d2=await r2.json();document.getElementById("no").textContent=d2.items.map(function(n){var c=n.status.conditions.find(function(x){return x.type=="Ready";});return(n.metadata.name+"          ").slice(0,28)+" "+(c&&c.status=="True"?"Ready":"NotReady");}).join("\n");}catch(e){}}
    k();setInterval(k,15000);
    async function ud(){try{var r=await fetch("/k8s/api/v1/pods?limit=200");var d=await r.json();var e=document.getElementById("dp");if(e)e.textContent=d.items.length;}catch(ex){}try{var r=await fetch("/k8s/api/v1/services?limit=100");var d=await r.json();var e=document.getElementById("ds");if(e)e.textContent=d.items.length;}catch(ex){}try{var r=await fetch("/k8s/api/v1/namespaces?limit=50");var d=await r.json();var e=document.getElementById("dns");if(e)e.textContent=d.items.length;}catch(ex){}try{var r=await fetch("/k8s/api/v1/nodes");var d=await r.json();var e=document.getElementById("dno");if(e)e.textContent=d.items.length;}catch(ex){}}
